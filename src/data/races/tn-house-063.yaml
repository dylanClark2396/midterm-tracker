# Tennessee House, District 63 (southeast Williamson County: parts of Brentwood and Franklin, Nolensville,
# Thompson's Station) — Rep. Jake McCalmon, in office since 2022, faces Laura Andreson in a 2024 rematch.
# Candidate order follows the Secretary of State's certified candidate list.
