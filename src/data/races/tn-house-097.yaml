id: tn-house-097
office: "Tennessee House, District 97"
level: state_house
district: 97
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "John Gillespie"
    ballot_party: Republican
    city: "Memphis"
    incumbent: true
    website: "https://repjohngillespie.com"
    bio_facts:
      - { text: "State representative for District 97 since November 2020; won re-election in 2022 and in 2024, when he defeated Jesse Huseth with 51.7% of the vote.", sources: [*bp_gillespie] }
      - { text: "Vice chair of the House Finance, Ways and Means Committee; also serves on the Health Committee, the Finance, Ways and Means Subcommittee, the Population Health Subcommittee and the Council on Pensions.", sources: [*cga_h97] }
      - { text: "Memphis native with a B.A. in political science from High Point University in North Carolina.", sources: [*cga_h97, *jg_about] }
      - { text: "Worked in banking at First Tennessee and in the mortgage division of Evolve Bank and Trust, then as grant coordinator at Trezevant Episcopal Home.", sources: [*jg_about, *bp_gillespie] }
      - { text: "Serves on the board of directors of the Memphis Shelby County Crime Commission.", sources: [*cga_h97, *jg_about] }
      - { text: "Prime sponsor of a 2023 law requiring that people convicted of rape, aggravated rape or especially aggravated kidnapping be sentenced within at least Range II.", sources: [*hb0005] }
    why_running:
      text: >-
        He says he is running to get good things done for the community and to be an effective advocate for Shelby
        County, which he calls home and does not want to see left behind other parts of the state.
      sources: [*jg_home]
    platform:
      - category: public_safety
        text: "Keep violent felons in prison for their full sentences, stiffen penalties for aggravated assault and crimes committed with a firearm, tighten bail and its enforcement, and add state troopers on Memphis interstates."
        sources: [*jg_issues]
      - category: taxes
        text: "Cut taxes on small businesses and keep Tennessee ranked at the top for fiscal stability."
        sources: [*jg_issues]
      - category: economy
        text: "Oppose costly mandates on small businesses."
        sources: [*jg_issues]
      - category: education
        text: "Strengthen school safety, fund more career and technical courses for high school students, give parents a strong voice in their children's education, and hold Memphis-Shelby County Schools accountable to parents and taxpayers."
        sources: [*jg_issues]
    arguments:
      - stance: for
        text: >-
          He has made violent crime in Memphis and Shelby County the focus of his time in office, sponsoring laws
          that keep violent offenders in prison longer and deny probation to those who use a gun.
        sources: [*lookout97, *jg_issues]
      - stance: against
        text: >-
          He sponsored the law that voided a Memphis ordinance against police stops for minor violations such as a
          broken taillight. Critics said those stops don't reduce crime and that the law strips cities of the power
          to set their own policing rules.
        sources: [*lookout_stops, *wpln_stops]
      - stance: against
        text: >-
          The truth-in-sentencing law he backs drew opposition from criminal justice advocates, who warned that
          removing early-release incentives could undercut rehabilitation programs and swell prison populations.
        sources: [*lookout97_2024]

  - name: "Jesse Huseth"
    ballot_party: Democratic
    city: "Memphis"
    incumbent: false
    website: "https://jessefor97.com"
    bio_facts:
      - { text: "Lifelong Memphian and University of Memphis graduate; he and his wife are raising two daughters in his childhood home in District 97.", sources: [*jh_home, *lookout97_2024] }
      - { text: "Former Shelby County Schools teacher who taught eighth-grade history and science for two years and still volunteers as a track coach; now a business owner.", sources: [*lookout97_2024, *jh_home] }
      - { text: "Lost to Gillespie in the 2024 race for this seat with 48.3% of the vote.", sources: [*bp_huseth] }
    why_running:
      text: >-
        He says leadership should work for all Tennesseans, not just the wealthy, and that he will fight for working
        families. He says local and state governments must set budgets and policies that genuinely support Memphis
        residents.
      sources: [*jh_home]
    platform:
      - category: education
        text: "End private school vouchers and redirect the money to statewide pre-K, raise teacher pay, and adopt a ten-year plan to substantially increase public school funding."
        sources: [*jh_policies]
      - category: health_care
        text: "Expand Medicaid to bring federal dollars back to Tennessee and ease the strain on local hospitals."
        sources: [*jh_policies]
      - category: abortion
        text: "Repeal the state abortion ban, which he links to fewer OB/GYN residency applicants and worse maternal and infant outcomes."
        sources: [*jh_policies]
      - category: public_safety
        text: "Make state funding for a Shelby County crime lab his first priority, to cut delays in testing evidence."
        sources: [*jh_policies]
      - category: guns
        text: "Repeal permitless carry, let courts issue extreme risk protection orders, and require secure storage of guns in vehicles."
        sources: [*jh_policies]
      - category: infrastructure
        text: "Invest in Memphis' infrastructure."
        sources: [*jh_home]
    arguments:
      - stance: for
        text: >-
          He wants a state-funded crime lab in Shelby County so DNA evidence and rape kits are tested faster,
          arguing that long testing backlogs are part of why suspects can't be held.
        sources: [*jh_policies, *lookout97_2024]

