candidates:
  - name: "Raumesh Akbari"
    ballot_party: Democratic
    city: "Memphis"
    incumbent: true
    website: null
    bio_facts:
      - { text: "State senator for District 29 since November 2018; Senate member of the 111th through 114th General Assemblies.", sources: [*bp_akbari, *cga_s29] }
      - { text: "Represented District 91 in the Tennessee House from 2013, when she won a special election, until 2018 (108th through 110th General Assemblies).", sources: [*bp_akbari, *cga_s29, *lookout29] }
      - { text: "Senate minority leader since January 2023.", sources: [*bp_akbari] }
      - { text: "Second vice chair of the Senate Education Committee; also serves on the Commerce and Labor, Calendar, and Ethics committees.", sources: [*cga_s29] }
      - { text: "Attorney; B.A. from Washington University in St. Louis (2006) and J.D. from Saint Louis University School of Law (2009).", sources: [*cga_s29, *lookout29] }
      - { text: "Board member of the National Civil Rights Museum.", sources: [*cga_s29, *mtnpress] }
      - { text: "Unopposed on the November 2026 ballot.", sources: [*lookout29, *bp_akbari] }
    why_running:
      text: >-
        In a video message released ahead of the governor's 2026 State of the State address, she said she did
        not run for office to make life easier for people already doing fine, but for working parents,
        grandparents raising grandchildren, young couples trying to buy a first home, and workers who still
        worry about paying the light bill.
      sources: [*mtnpress]
    platform:
      - category: economy
        text: "Raise the minimum wage so that a full-time job supports a decent life, and invest in thriving local businesses."
        sources: [*mtnpress, *flyer]
      - category: taxes
        text: "End the state sales tax on groceries."
        sources: [*mtnpress, *flyer]
      - category: education
        text: "Invest in strong public schools and make child care and early education affordable."
        sources: [*mtnpress, *flyer]
      - category: health_care
        text: "Expand health coverage so no family fears a medical bill more than a diagnosis."
        sources: [*mtnpress, *flyer]
      - category: infrastructure
        text: "Invest in safe infrastructure."
        sources: [*mtnpress, *flyer]
    arguments: []

