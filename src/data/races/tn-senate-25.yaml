# Tennessee Senate, District 25 (Crockett, Decatur, Dyer, Henderson, Lake, Madison and Perry counties) —
# Sen. Ed Jackson, in the Senate since 2014, is the only candidate on the ballot.
# Candidate order follows the Secretary of State's certified candidate list.
