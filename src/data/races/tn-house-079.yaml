candidates:
  - name: "Brock Martin"
    ballot_party: Republican
    city: "Huntingdon"
    incumbent: true
    website: "https://www.brockmartinfortn.com"
    bio_facts:
      - { text: "State representative for District 79 since November 2022; House member of the 113th and 114th General Assemblies.", sources: [*bp_martin, *cga_h79] }
      - { text: "Chair of the House Health Subcommittee; also serves on the Commerce, Health and Insurance committees.", sources: [*cga_h79, *lookout79] }
      - { text: "Chiropractor; he and his wife opened Southern Chiropractic and Acupuncture in Huntingdon, where he is clinical director.", sources: [*bm_about, *bp_martin] }
      - { text: "Born in Carroll County and raised in Camden; graduate of Camden Central High School and Bethel University, with a Doctor of Chiropractic from Logan College of Chiropractic (2010).", sources: [*bm_about, *cga_h79] }
      - { text: "Member of the Bethel University Board of Trustees, treasurer of the Huntingdon Industrial Board, and former president of the Tennessee Chiropractic Association.", sources: [*cga_h79, *bm_about] }
      - { text: "Won the open seat in 2022 with 81.2% of the general election vote; unopposed in the 2024 general election and the 2026 primary.", sources: [*bp_martin] }
      - { text: "Sponsored HJR0069 (2025), a resolution urging the state to adopt a plan to make Tennessee healthy; it passed the House 90-0 and the Senate 32-0.", sources: [*hjr0069] }
      - { text: "His 2025 bills included measures on insurance coverage of biomarker testing for cancer, ambulance reimbursement, support for the Megasite of West Tennessee, and barring electronic service providers from tipping off people whose phone records are subpoenaed in child exploitation cases.", sources: [*bm_news] }
    why_running:
      text: >-
        He says he is running to build a prosperous future for his family, his business and his community, and to
        be a voice for small business owners, whom he calls the heartbeat of rural counties.
      sources: [*bm_home]
    platform:
      - category: economy
        text: "Speak for small business owners in rural counties and limit government intervention so businesses can thrive."
        sources: [*bm_home]
      - category: health_care
        text: "Supports repealing certificate-of-need rules to allow more competition among hospitals and outpatient clinics, which he says will lower costs and improve care."
        sources: [*bm_news]
    arguments:
      - stance: for
        text: >-
          A chiropractor who has treated thousands of patients in the Huntingdon area, he brings hands-on health
          care experience to his work chairing the House Health Subcommittee.
        sources: [*bm_about, *cga_h79]

