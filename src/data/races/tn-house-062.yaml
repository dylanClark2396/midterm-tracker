candidates:
  - name: "Pat Marsh"
    ballot_party: Republican
    city: "Shelbyville"
    incumbent: true
    website: null
    bio_facts:
      - { text: "State representative for District 62 since winning a 2009 special election; House member of the 106th through 114th General Assemblies.", sources: [*lookout62, *cga_h62, *bp_marsh] }
      - { text: "Speaker pro tempore of the House in the 112th General Assembly.", sources: [*cga_h62] }
      - { text: "Chairs the House Ethics Committee and the Workplace Discrimination and Harassment Subcommittee; also serves on the Calendar & Rules, Commerce, Government Operations and Transportation committees.", sources: [*cga_h62] }
      - { text: "Founded the trucking company Big G Express and sold it in 2009; now its chairman emeritus. B.S. in transportation from the University of Tennessee.", sources: [*lookout62, *cga_h62] }
      - { text: "Sponsored a 2026 law designating nearly all of the Duck and Buffalo rivers and some of their tributaries as Class II pastoral scenic river areas.", sources: [*hb1510, *duck_apr] }
      - { text: "Sponsored a 2025 law allowing school districts to adopt merit-based pay for high-performing educators.", sources: [*hb0759] }
      - { text: "Sponsored a 2026 law changing state law on fraudulent freight theft.", sources: [*hb2139] }
    why_running: { text: null, sources: [] }
    platform: []
    arguments:
      - stance: for
        text: >-
          Carried the 2026 law extending scenic-river protection, including a ban on new landfills nearby, to nearly
          all of the Duck and Buffalo rivers. He says he is looking out for landowners along the river who want to
          protect it and their way of life.
        sources: [*duck_mar, *duck_apr]
      - stance: against
        text: >-
          A legislative opponent of his scenic-river bill argued its ban on landfills within two miles of the rivers
          overrides landowners' constitutional property rights, and warned of legal costs to the state.
        sources: [*duck_mar, *duck_apr]

  - name: "Brieanna L Akers"
    ballot_party: Democratic
    city: "Bell Buckle"
    incumbent: false
    website: "https://briefortennessee.com"
    bio_facts:
      - { text: "Independent Medicare insurance agent who works in senior-market sales.", sources: [*ba_about, *bp_akers, *lookout62] }
      - { text: "Has lived in Bedford County for 34 years and attended Cascade School; single parent of a 12-year-old.", sources: [*ba_about, *bp_akers] }
      - { text: "First campaign for public office.", sources: [*lookout62] }
    why_running:
      text: >-
        She says that as an insurance agent she has seen clients on fixed incomes struggle to budget between health
        care and bills, and that she is running for a Tennessee where people can afford groceries, keep their land,
        raise their kids and know their voice matters. She also says she wants equal rights for all, with laws that
        protect rather than discriminate.
      sources: [*ba_about, *bp_akers]
    platform:
      - category: economy
        text: "Propose a gradual state minimum wage above $7.25 with a review every two years, paired with temporary tax credits for small businesses."
        sources: [*ba_about, *ba_home, *bp_akers]
      - category: taxes
        text: "Raise taxes modestly on large corporations to pay for eliminating the state sales tax on groceries."
        sources: [*ba_about, *bp_akers]
      - category: education
        text: "End the school voucher program and give public schools more funding and resources, working with teachers and administrators."
        sources: [*ba_about, *ba_home, *bp_akers]
      - category: agriculture
        text: "Revive rural communities and help local farmers become more independent by making better use of agricultural grants and resources."
        sources: [*ba_about, *ba_home]
      - category: government
        text: "Refuse PAC money and run on support from individual residents."
        sources: [*bp_akers, *ba_about]
    arguments:
      - stance: for
        text: >-
          She pledges not to take PAC money, saying she is backed by local residents rather than big money and will
          work for the people of the district.
        sources: [*bp_akers, *ba_about]

