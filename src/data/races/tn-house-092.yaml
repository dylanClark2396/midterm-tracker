id: tn-house-092
office: "Tennessee House, District 92"
level: state_house
district: 92
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Todd Warner"
    ballot_party: Republican
    city: "Lewisburg"
    incumbent: true
    website: "https://toddfortn.com"
    bio_facts:
      - { text: "State representative for District 92 since November 2020; House member of the 112th through 114th General Assemblies.", sources: [*bp_warner, *cga_h92] }
      - { text: "Member of the House State & Local Government Committee, the Naming & Designating Committee and the Public Service Subcommittee; served on the Disaster Relief and Immigration committees of an extraordinary session.", sources: [*cga_h92] }
      - { text: "Former member of the Marshall County School Board and former alderman for the Town of Chapel Hill.", sources: [*cga_h92, *tw_home] }
      - { text: "Raised on a dairy farm in Chapel Hill and grows corn and soybeans; worked six years for United Telephone before starting his own business, and has been self-employed since. Graduated from Forrest High School in 1989.", sources: [*tw_home, *bp_warner] }
      - { text: "Voted against the state's private school voucher program in 2025 and has supported repealing the state sales tax on groceries.", sources: [*lookout92, *firefly_quarry] }
      - { text: "Ran for the U.S. House in the redrawn 9th Congressional District in 2026 and finished second in the August 6 primary with 26.3% of the vote.", sources: [*bp_warner, *lookout_cd9] }
      - { text: "Won the August 2026 primary for this seat with 52.2% of the vote; defeated Teri Mai in the 2024 general election, 74.5% to 25.5%.", sources: [*bp_warner, *firefly92] }
    why_running: { text: null, sources: [] }
    platform:
      - category: guns
        text: "Fight for and protect the Second Amendment right to bear arms."
        sources: [*tw_home]
      - category: economy
        text: "Support small businesses and help owners succeed by stopping over-regulation and removing needless bureaucratic obstacles."
        sources: [*tw_home]
      - category: immigration
        text: "Stand strong against illegal immigration and improve border security."
        sources: [*tw_home]
      - category: agriculture
        text: "Protect family farmers so future generations can keep farming."
        sources: [*tw_home]
      - category: education
        text: "Empower teachers, parents and students."
        sources: [*tw_home]
    arguments:
      - stance: for
        text: >-
          An eighth-generation farmer and longtime small-business owner who says he has pushed back on
          over-regulation and kept his word as a watchdog for constitutional rights.
        sources: [*tw_home]
      - stance: against
        text: >-
          Marshall County neighbors opposed a lake project on his farm that they called a rock quarry, citing
          blasting damage to homes and risks to wells; the county zoning board unanimously denied it.
        sources: [*firefly_quarry, *wsmv_quarry, *lookout_cd9]

  - name: "Teri Mai"
    ballot_party: Democratic
    city: "Spring Hill"
    incumbent: false
    website: "https://www.terimai4tn.com"
    bio_facts:
      - { text: "Attorney in the complex litigation group at Morgan & Morgan; previously worked as a legal assistant for about 25 years.", sources: [*tm_about, *bp_mai, *lookout92] }
      - { text: "Bachelor's degree from St. Edward's University (1993), earned while working full time; law degree from Florida Coastal School of Law (2014), started at age 55.", sources: [*tm_about, *bp_mai] }
      - { text: "Born and raised in Texas; moved to Spring Hill in January 2021 after taking a job with the U.S. Small Business Administration.", sources: [*tm_about, *tm_announce] }
      - { text: "Has held a leadership role in the Williamson County Democratic Party.", sources: [*tm_announce, *scene_mai] }
      - { text: "Lost the 2024 general election for this seat to Todd Warner, 25.5% to 74.5%; unopposed in the August 2026 primary.", sources: [*bp_mai, *firefly92] }
    why_running:
      text: >-
        She says she wants to make Tennessee a more family-friendly, affordable place to live and to give her
        neighbors a voice at the Capitol, including those who don't agree with her. She says representation
        shouldn't be reserved for the wealthy and well-connected.
      sources: [*bp_mai, *tm_home]
    platform:
      - category: economy
        text: "Establish a livable minimum wage so a full-time worker can cover rent, utilities, transportation and food; support labor unions."
        sources: [*bp_mai, *tm_wage, *tm_unions]
      - category: taxes
        text: "Eliminate the state sales tax on groceries."
        sources: [*bp_mai, *tm_grocery]
      - category: education
        text: "End the private school voucher program and fully fund public schools."
        sources: [*bp_mai, *tm_vouchers]
      - category: health_care
        text: "Protect health care access as rural hospitals close, and expand access to mental health care and opioid addiction recovery."
        sources: [*tm_issues, *tm_health, *tm_mental]
      - category: infrastructure
        text: "Improve roads, bridges and high-speed internet in rural areas of the district."
        sources: [*tm_infra]
      - category: guns
        text: "Pass gun safety measures such as safe storage and stronger permitting laws; oppose allowing teachers and staff to carry guns in schools."
        sources: [*tm_about, *scene_mai, *tm_arming]
      - category: abortion
        text: "Protect women's reproductive rights and the right to bodily autonomy."
        sources: [*tm_about, *tm_announce]
      - category: government
        text: "Pursue election reforms that make voting safe and accessible for every eligible voter, including restoring voting rights to people who have served their sentences."
        sources: [*tm_announce, *scene_mai]
    arguments:
      - stance: for
        text: >-
          She put herself through college while working full time and raising a child, then finished law school
          after 55, and promises open communication with every resident of the district.
        sources: [*bp_mai, *tm_about, *tm_home]

