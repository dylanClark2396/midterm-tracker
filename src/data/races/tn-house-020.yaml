# Tennessee House, District 20 (western Blount County, including Maryville) — Rep. Tom Stinnett, in office since
# 2024, faces Karen Gertz (a 2024 rematch) and independent Jeff "Cog" Coggin.
# Candidate order follows the Secretary of State's certified candidate list.
