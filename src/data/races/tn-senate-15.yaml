candidates:
  - name: "Paul Bailey"
    ballot_party: Republican
    city: "Sparta"
    incumbent: true
    website: "https://paulbaileyfortn.com/"
    bio_facts:
      - { text: "State senator for District 15 since November 2014; Senate member of the 109th through 114th General Assemblies. Earlier in 2014 he was chosen to fill an unexpired term in House District 42.", sources: [*bp_bailey, *cga_s15, *pb_about] }
      - { text: "Chair of the Senate Commerce and Labor Committee since 2018 and a member of the Fiscal Review and Transportation and Safety committees; chaired the Senate Transportation Committee in 2017.", sources: [*cga_s15, *pb_about, *bp_bailey] }
      - { text: "Former chairman of the White County Commission and past chairman of the White County Republican Party.", sources: [*pb_about, *lookout15] }
      - { text: "General manager of CB Trucking, a family trucking business with about 100 employees that he and his father started; also a small farmer. Attended Tennessee Tech University.", sources: [*pb_about, *cga_s15, *bp_bailey] }
      - { text: "Running for Senate speaker, a post whose holder also serves as lieutenant governor; a caucus vote on the post is set for November 10.", sources: [*lk_speaker, *lookout15] }
      - { text: "Senate sponsor of a 2026 bill (SB1911) requiring the state to apply for federal summer food-assistance funds for children; it cleared the Senate Health and Welfare Committee but did not pass.", sources: [*sb1911, *lk_sebt] }
      - { text: "Senate sponsor of a 2026 law (SB2459) that generally bars the Department of Children's Services from asking foster parents the number or type of firearms they own or requiring them to display or provide access to them; the department may still ask whether firearms are securely stored.", sources: [*sb2459, *pb_upd321] }
    why_running: { text: null, sources: [] }
    platform:
      - category: economy
        text: "Advocate for growth and prosperity in rural Tennessee as well as its fast-growing urban and suburban areas."
        sources: [*pb_about]
      - category: government
        text: "Keep state government small."
        sources: [*pb_about]
    arguments:
      - stance: for
        text: >-
          He helped build a family trucking business that now employs about 100 people, and his campaign says he
          brings that business experience to the Senate as an advocate for rural growth.
        sources: [*pb_about]

