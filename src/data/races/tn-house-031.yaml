# Tennessee House, District 31 (Bledsoe, Rhea, Sequatchie and Van Buren counties) — open seat after Rep. Ron
# Travis's retirement. Andy Swafford, Michael Woodlee and two independents.
# Candidate order follows the Secretary of State's certified candidate list.
_sources:
  lookout31: &lookout31 { url: "https://tennesseelookout.com/voter-guides/contests/house-district-31/", title: "Tennessee House of Representatives, 31st District voter guide (Tennessee Lookout)", accessed: 2026-10-15 }
