id: tn-house-071
office: "Tennessee House, District 71"
level: state_house
district: 71
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Kip Capley"
    ballot_party: Republican
    city: "Summertown"
    incumbent: true
    website: "https://www.votecapley.com/"
    bio_facts:
      - { text: "State representative for District 71 since November 2022, succeeding David Byrd; House member of the 113th and 114th General Assemblies.", sources: [*bp_capley, *lookout71, *cga_h71] }
      - { text: "Serves on the House Finance, Ways and Means Committee and its subcommittee, the Health Committee, and the Private Acts Committee.", sources: [*cga_h71] }
      - { text: "B.S. in political science and history from Middle Tennessee State University; MBA in healthcare management from Trevecca Nazarene University, cum laude.", sources: [*cga_h71, *bp_capley] }
      - { text: "Lists his occupation as business development coordinator; previously worked in a congressional office; coaches youth football and basketball in Summertown.", sources: [*cga_h71, *kc_endorse] }
      - { text: "Sponsored HB1708, enacted in 2026, which requires written driver's license exams in English after a one-time exception and requires proof of citizenship or lawful status to register a vehicle.", sources: [*hb1708, *pr_english] }
      - { text: "Sponsored HB1802, enacted in 2026 through its Senate companion, which allows deadly force to protect property in certain circumstances, such as preventing arson, burglary or robbery.", sources: [*hb1802, *pr_property] }
    why_running:
      text: >-
        His campaign site says he wants to be a strong voice for every person in the district and take residents'
        concerns to Nashville.
      sources: [*kc_home]
    platform:
      - category: taxes
        text: "Lower taxes to ease the burden of inflation on families while protecting small businesses and entrepreneurs."
        sources: [*kc_home]
      - category: health_care
        text: "Reduce health care costs and make sure access to care is readily available."
        sources: [*kc_home]
      - category: abortion
        text: "Defend the life of the unborn."
        sources: [*kc_home]
      - category: public_safety
        text: "Fully support law enforcement and first responders."
        sources: [*kc_home]
      - category: education
        text: "Sponsor legislation to provide improved resources for educators and students."
        sources: [*kc_home]
      - category: guns
        text: "Defend constitutional rights, especially the Second Amendment."
        sources: [*kc_home]
    arguments:
      - stance: for
        text: >-
          He says requiring written driver's exams in English makes sure drivers can understand road signs and
          traffic laws, which he argues protects families and improves road safety.
        sources: [*pr_english]
      - stance: for
        text: >-
          He says his property-defense law lets residents use deadly force only as a last resort, so they no longer
          have to wait and watch while a criminal destroys what they have worked for.
        sources: [*pr_property, *wpln_force, *wsmv_force]
      - stance: against
        text: >-
          His 2025 bill to make driver's license tests English-only was voted down in a House subcommittee after
          concerns that it could hurt executives and workers at international companies doing business in Tennessee.
        sources: [*tl_2025]
      - stance: against
        text: >-
          A resident testifying against the 2026 English-only driver's exam bill, which he carried in the House, said
          it would make roads less safe by increasing the number of unlicensed drivers.
        sources: [*tl_2026]
      - stance: against
        text: >-
          Testimony against an early version of his deadly-force bill warned it was so broad that someone stepping
          into a yard or turning around in a driveway could trigger it.
        sources: [*wpln_force]
      - stance: against
        text: >-
          A lawmaker opposing his deadly-force bill said it substantially lowers the threshold for killing someone
          over property.
        sources: [*wsmv_force]

  - name: "Matt Day"
    ballot_party: Democratic
    city: "Columbia"
    incumbent: false
    website: "https://www.facebook.com/MattDayTN71/"
    bio_facts:
      - { text: "Accountant; first campaign for public office.", sources: [*lookout71] }
      - { text: "Middle Tennessee native who describes himself as an outdoorsman, beekeeper and orchardist.", sources: [*bp_day] }
    why_running: { text: null, sources: [] }
    platform:
      - category: health_care
        text: "Make health care more available."
        sources: [*bp_day]
      - category: education
        text: "Protect public schools."
        sources: [*bp_day]
      - category: taxes
        text: "Tax relief for working families and fairer taxes."
        sources: [*bp_day]
    arguments: []

