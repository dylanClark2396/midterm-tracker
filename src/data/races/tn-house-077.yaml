id: tn-house-077
office: "Tennessee House, District 77"
level: state_house
district: 77
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Rusty Grills"
    ballot_party: Republican
    city: "Newbern"
    incumbent: true
    website: "https://rustygrillsfortn.com/"
    bio_facts:
      - { text: "State representative for District 77 since January 2020, after winning a December 2019 special election; House member of the 111th through 114th General Assemblies.", sources: [*bp_grills, *cga_h77, *lookout77] }
      - { text: "Chairs the House Business & Utilities Subcommittee; also serves on the Agriculture & Natural Resources, Commerce, and Finance, Ways & Means committees and the Select Committee on Rules.", sources: [*cga_h77, *lookout77] }
      - { text: "Dyer County commissioner from 2010 to 2020.", sources: [*cga_h77, *rg_home] }
      - { text: "Farmer who describes himself as a ninth-generation farmer; home-school graduate (2000) who attended TCAT from 1999 to 2001.", sources: [*rg_home, *cga_h77] }
      - { text: "Lives in Newbern with his wife and two daughters.", sources: [*rg_home, *cga_h77] }
      - { text: "House sponsor of a 2025 bill, enacted through its Senate companion, that lets a charity be held liable for crimes committed by a person it knowingly houses who is unlawfully present in the U.S., when its conduct in providing the housing is negligent or worse.", sources: [*hb0811, *lookout_charities] }
      - { text: "In 2023, sponsored a special-session bill to let juvenile courts transfer 16- and 17-year-olds to adult court for burglaries involving the theft of a firearm.", sources: [*hb7030, *lookout_teen_guns] }
    why_running:
      text: >-
        On his campaign site, written for his 2024 re-election, he says representing District 77 has been an honor
        and that he wants to take the region's values to Nashville and keep Tennessee's future prosperous for everyone.
      sources: [*rg_home]
    platform:
      - category: guns
        text: "Opposes red flag laws and is committed to protecting the right to keep and bear arms."
        sources: [*rg_home]
      - category: economy
        text: "Continue business-friendly policies that create jobs and promote economic growth."
        sources: [*rg_home]
      - category: abortion
        text: "Supports Tennessee's permanent ban on abortion; says life begins at conception."
        sources: [*rg_home]
      - category: agriculture
        text: "Support farmers and ranchers by advocating for the district's agricultural needs."
        sources: [*rg_home]
      - category: education
        text: "Prioritize local control of education and freedom for teachers in the classroom, along with school investment and higher teacher pay."
        sources: [*rg_home]
      - category: taxes
        text: "Keep Tennessee among the lowest-taxed states and let taxpayers keep more of their money by avoiding excessive regulation."
        sources: [*rg_home]
    arguments:
      - stance: for
        text: >-
          His campaign says he has secured more than $30 million for economic development in District 77 and
          millions of dollars for road improvements in rural West Tennessee.
        sources: [*rg_home]
      - stance: for
        text: >-
          His campaign says that in 10 years on the Dyer County Commission he never voted to raise taxes.
        sources: [*rg_home]
      - stance: against
        text: >-
          Critics said in 2025 that his bill making charities liable for crimes by people they house who lack legal
          immigration status would hamper charities' housing assistance and put them in conflict with federal
          housing program rules.
        sources: [*lookout_charities]

  - name: "Erin Jerrod Reid"
    ballot_party: Independent
    city: "Tiptonville"
    why_running: { text: null, sources: [] }
    platform: []
    arguments: []

