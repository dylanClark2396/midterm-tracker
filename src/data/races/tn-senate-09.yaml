      - { text: "Chaired the Senate Environment, Conservation and Tourism Committee in 2009–2012 and the Senate Energy, Agriculture and Natural Resources Committee in the 2013–2014, 2015, 2017, 2019–2020, 2021–2022 and 2023–2024 sessions.", sources: [*bp_ss] }
      - { text: "Mortgage broker; attended Walters State Community College.", sources: [*cga_s9, *bp_ss] }
      - { text: "Senate sponsor of a 2018 law (Public Chapter 1057) calling for a privately funded monument to unborn children on the State Capitol campus.", sources: [*sb2227, *lookout9] }
