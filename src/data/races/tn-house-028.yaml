# Tennessee House, District 28 (central and east Chattanooga) — Rep. Yusuf Hakeem, in office since 2018, faces
# two independents, former city council member Demetrus Coonrod and Johnny Horne. No Republican qualified.
# Candidate order follows the Secretary of State's certified candidate list.
