id: tn-house-023
office: "Tennessee House, District 23"
level: state_house
district: 23
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Mark Cochran"
    ballot_party: Republican
    city: "Englewood"
    incumbent: true
    website: "https://www.markforstaterep.com"
    bio_facts:
      - { text: "State representative for District 23 since November 2018; House member of the 111th through 114th General Assemblies.", sources: [*bp_cochran, *cga_h23] }
      - { text: "Assistant Majority Leader in the 113th and 114th General Assemblies; member of the Finance, Ways and Means, Commerce, Calendar and Rules, and Ethics committees.", sources: [*cga_h23] }
      - { text: "Began his political career in 2010 as a staff assistant in a U.S. senator's office; has served as chief of staff in the McMinn County Mayor's Office.", sources: [*lookout23, *cga_h23] }
      - { text: "B.S. in communication and master's in public administration from the University of Tennessee.", sources: [*cga_h23] }
      - { text: "Grew up on a sixth-generation family cattle farm and worked in his father's grocery store.", sources: [*mc_home] }
      - { text: "Won the August 2026 primary with 63.3% of the vote.", sources: [*bp_cochran, *firefly23] }
    why_running:
      text: >-
        He says he wants Tennessee to remain a place where people are free to pursue their purpose without
        government interference, and asks voters to send him back to Nashville to keep working for McMinn and
        Monroe counties.
      sources: [*mc_home]
    platform:
      - category: taxes
        text: "Says he has co-sponsored nearly $1 billion in state tax cuts."
        sources: [*mc_home]
      - category: education
        text: "Sponsored a law requiring grade 6-12 teachers to complete a free state course on using artificial intelligence in the classroom."
        sources: [*sp_h23]
      - category: health_care
        text: "Says he helped lead efforts to ban gender-transition surgeries for minors and to keep male athletes out of women's sports."
        sources: [*mc_home]
      - category: public_safety
        text: "Sponsored a law letting counties add a $12.50 charge to criminal court costs to fund public safety support chosen by the district attorney."
        sources: [*sp_h23]
      - category: immigration
        text: "Sponsored a law requiring local agreements with federal immigration officials to include honoring immigration detainers."
        sources: [*sp_h23]
      - category: government
        text: "Sponsored a law requiring government policies to define sex as male or female based on anatomy and genetics at birth."
        sources: [*sp_h23]
      - category: abortion
        text: "Says he has fought to protect the lives of the unborn."
        sources: [*mc_home]
    arguments:
      - stance: for
        text: >-
          Shaped by work on a family farm and in two family businesses, he points to a record that includes
          co-sponsoring nearly $1 billion in tax cuts for Tennesseans.
        sources: [*mc_home]

  - name: "Jeremy Bromwell"
    ballot_party: Independent
    city: "Tellico Plains"
    incumbent: false
    website: "https://jeremy4tn.com"
    bio_facts:
      - { text: "Runs Grow and Flow, a small regenerative farm and yoga and movement studio in Tellico Plains; bought land in Ballplay in 2020.", sources: [*jb_bio, *lookout23] }
      - { text: "Spent about a decade in branding and storytelling for agencies and tech startups in cities including Atlanta, New York and San Francisco.", sources: [*jb_bio] }
      - { text: "Certified in trauma-sensitive yoga in 2025.", sources: [*jb_bio] }
      - { text: "First campaign for public office; qualified for the ballot by petition.", sources: [*lookout23, *firefly23] }
    why_running:
      text: >-
        He says District 23 deserves a representative focused on daily life rather than on pleasing Washington or
        chasing PAC money, and that he got on the ballot to give voters a choice. He says he will listen first and
        bring people together to make life better in the district.
      sources: [*jb_bio, *jb_home]
    platform:
      - category: cost_of_living
        text: "Raise local wages, keep money in the district, and make it easier to start a business amid rising costs for groceries, housing and child care."
        sources: [*jb_platform]
      - category: education
        text: "Oppose school vouchers; fully fund public schools, pay teachers well, support smaller classes and expand vocational training and the arts."
        sources: [*jb_platform]
      - category: health_care
        text: "Protect rural health care access, close insurance gaps, expand coverage and invest in community-based mental health and addiction care."
        sources: [*jb_platform]
      - category: environment
        text: "Balance development with preservation, back agritourism and outdoor recreation, and help farmers to slow the loss of farmland."
        sources: [*jb_platform]
      - category: government
        text: "Create legislative term limits and get big money out of politics; his campaign takes no PAC money."
        sources: [*jb_platform, *jb_home]
      - category: abortion
        text: "Says decisions about a person's body should be left to the person and their doctor."
        sources: [*jb_platform]
      - category: immigration
        text: "Keep local law enforcement focused on local public safety rather than expanding cooperation with federal immigration agencies."
        sources: [*jb_platform]
      - category: infrastructure
        text: "Oppose data centers that lack community approval; require plans to protect local water and power before construction."
        sources: [*jb_platform]
    arguments:
      - stance: for
        text: >-
          Not tied to any party, he says he can work with anyone who has good ideas, and his campaign is funded
          only by individual donors.
        sources: [*jb_home]

  - name: "Jason Hitt"
    ballot_party: Independent
    city: "Englewood"
    incumbent: false
    website: null
    bio_facts:
      - { text: "Teacher with Sweetwater public schools.", sources: [*lookout23, *bp_hitt] }
      - { text: "Qualified for the ballot by petition.", sources: [*firefly23] }
    why_running:
      text: >-
        He says he stands for common-sense government for everyone that serves the people rather than interest
        groups.
      sources: [*bp_hitt]
    platform:
      - category: education
        text: "Supports public education."
        sources: [*bp_hitt]
      - category: guns
        text: "Supports Second Amendment rights."
        sources: [*bp_hitt]
      - category: government
        text: "Equality for all under the law."
        sources: [*bp_hitt]
    arguments: []

