id: tn-senate-33
office: "Tennessee Senate, District 33"
level: state_senate
district: 33
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNSenate_Nov2026.pdf"

candidates:
  - name: "London Lamar"
    ballot_party: Democratic
    city: "Memphis"
    incumbent: true
    website: "https://www.londonlamar.com"
    bio_facts:
      - { text: "State senator for District 33 since March 2022, when she was appointed to fill a vacancy; elected to the seat in November 2022. State representative for District 91 from 2018 to 2022.", sources: [*bp_lamar, *lookout33, *cga_s33] }
      - { text: "Chair of the Senate Democratic Caucus; member of the Senate Finance, Ways and Means Committee, the Senate Judiciary Committee and the Joint Ways and Means Committee.", sources: [*cga_s33, *ll_herstory] }
      - { text: "Won the August 6, 2026 primary for this seat with about 76% of the vote; also ran for U.S. House District 9 in 2026 and lost that primary.", sources: [*bp_lamar] }
      - { text: "Has passed 23 bills, including a law requiring the state health department to cover maternal mental health disorders in continuing education and a study of certified nurse midwives; named 2022 legislator of the year by the Rural Health Association of Tennessee.", sources: [*mlk50] }
      - { text: "Memphis native and third-generation resident of the district; graduated from Central High School in 2009 and earned a B.A. in political science from Saint Mary's College in 2013.", sources: [*ll_about, *cga_s33, *lookout33] }
      - { text: "CEO of The L2 Company and a consultant; previously worked as a public education organizer and co-founded a political action committee that trains young Memphis leaders seeking office.", sources: [*bp_lamar, *ll_about] }
    why_running:
      text: >-
        She says she fights for families and the future of the district by pressing for strong schools, healthy
        families and safe communities, and that people's priorities must come before politics.
      sources: [*ll_home, *ll_herstory]
    platform:
      - category: education
        text: "Fully fund public schools, with more money for special education, at-risk students and Title I schools; a 10% statewide raise for teachers; full reading and math proficiency by third grade; lead-free schools, more school safety officers and more local control."
        sources: [*ll_schools]
      - category: health_care
        text: "Expand state-funded health coverage and CoverKids; insurance coverage for doulas, community health workers and school nurses; lower prescription costs; free preventive care; mental health counseling for all; and lower infant and maternal death rates."
        sources: [*ll_health]
      - category: public_safety
        text: "Build community-police relationships with accountability and de-escalation training; more support to reduce domestic violence; conflict-resolution training in K-12; funding for youth jobs, summer programs and reentry; alternatives to incarceration, expungement and legalized marijuana."
        sources: [*ll_safe]
      - category: guns
        text: "Reduce gun violence and reverse permitless carry."
        sources: [*ll_safe]
      - category: government
        text: "Protect voting rights."
        sources: [*ll_safe]
      - category: environment
        text: "Reduce toxins and create a healthier environment."
        sources: [*ll_health]
    arguments:
      - stance: for
        text: >-
          She points to 23 bills she has passed in the legislature, including maternal health measures, as proof
          that she can work within the system to turn residents' problems into results.
        sources: [*mlk50]
      - stance: for
        text: >-
          Her campaign says she has helped secure more than $40 million in resources for Shelby County.
        sources: [*ll_herstory]
      - stance: against
        text: >-
          Shortly after her first election in 2018, she said in a since-deleted video that Tennessee is racist and
          that most voters who backed the other party were uneducated; some constituents found the remarks
          troubling, and she apologized for overgeneralizing.
        sources: [*cbs2018]
      - stance: against
        text: >-
          During her 2026 congressional primary, a Memphis rhetoric expert said the way she maneuvers to win over
          voters is not persuasive, and a Memphis resident said her criticism of a fellow lawmaker's confrontation
          with state troopers meant she was choosing the wrong side of history.
        sources: [*mlk50]

