id: tn-house-049
office: "Tennessee House, District 49"
level: state_house
district: 49
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Mike Sparks"
    ballot_party: Republican
    city: "Smyrna"
    incumbent: true
    website: "https://votemikesparks.com/"
    bio_facts:
      - { text: "State representative for District 49 since 2010; House member of the 107th through 114th General Assemblies.", sources: [*bp_sparks, *cga_h49] }
      - { text: "Vice chair of the House Private Acts Committee; also serves on the Finance, Ways and Means, Government Operations and Insurance committees.", sources: [*cga_h49] }
      - { text: "Rutherford County commissioner from 2002 to 2010 and a member of Smyrna's planning commission from 2001 to 2010.", sources: [*cga_h49, *lookout49] }
      - { text: "Smyrna business owner and author; started a car dealership that sold cars online and now owns a salon with his wife; co-hosts a weekly community-issues radio show on WGNS.", sources: [*ms_home, *cga_h49] }
      - { text: "Associate's degree in mass communication from Motlow State Community College and a degree from Middle Tennessee State University; trained as an EMT at Volunteer State Community College.", sources: [*cga_h49, *ms_home] }
      - { text: "Sponsored HB1790 (2026) to lower the minimum age for a school bus driver endorsement from 25 to 23; the Senate version passed 32-0, and the House bill was taken off notice in a Finance, Ways and Means subcommittee.", sources: [*hb1790, *pr_bus] }
      - { text: "Sponsored HB2086 (2026), the Fresh Food Affordability Act, to exempt fresh fruits and vegetables from the state sales tax on food; the bill was taken off notice in a House Finance, Ways and Means subcommittee.", sources: [*hb2086, *pr_food] }
      - { text: "In 2023 proposed legislation barring police from questioning children without a lawyer, parent or guardian present, and requiring that such interviews be recorded.", sources: [*lookout_juv] }
      - { text: "Asked the state's Advisory Commission on Intergovernmental Relations to study how impact fees affect housing prices.", sources: [*lookout_zoning] }
    why_running: { text: null, sources: [] }
    platform:
      - category: health_care
        text: "Require price transparency from hospitals and insurers to bring down health care costs, and address children's mental and behavioral health, including through chess in schools and music therapy."
        sources: [*ms_health, *ms_oped]
      - category: immigration
        text: "Says illegal immigration is to blame for strained county finances in Rutherford County."
        sources: [*lookout_2024]
    arguments:
      - stance: for
        text: >-
          He has proposed ending the state sales tax on fresh fruits and vegetables, saying it would ease
          grocery bills for families and encourage healthier eating.
        sources: [*pr_food, *wsmv_food]
      - stance: for
        text: >-
          He has pushed to let 23-year-olds drive school buses under existing training rules, saying a bigger
          pool of drivers would give children safe, reliable rides to school; the county school board backed it.
        sources: [*pr_bus, *firefly_bus]
      - stance: for
        text: >-
          After the county paid a settlement over the jailing of children, he proposed requiring a lawyer or
          parent to be present before police question a child, and recording those interviews.
        sources: [*lookout_juv]
      - stance: against
        text: >-
          School board members who opposed his push to lower the bus driver age said younger drivers add
          liability for the school system and that data on the safety risk was never provided.
        sources: [*firefly_bus]
      - stance: against
        text: >-
          A local juvenile court attorney said his proposal on questioning children would not get at the root
          of the problem, arguing children in minor cases should be summoned to court rather than detained.
        sources: [*lookout_juv]
      - stance: against
        text: >-
          His 2024 opponent said he is too busy holding onto power and catering to special interests.
        sources: [*lookout_2024]

  - name: "Connie Casha"
    ballot_party: Democratic
    city: "Smyrna"
    incumbent: false
    website: "https://conniecasha4tndistrict-49.com/"
    bio_facts:
      - { text: "Worked 15 years at the Tennessee Department of Education, where she helped develop the state's voluntary pre-K program and oversaw its growth from 30 pilot classrooms to 934 classrooms serving 18,000 children.", sources: [*cc_about, *lookout49] }
      - { text: "Director of Early Learning Programs and an adjunct in the College of Education at Middle Tennessee State University for nearly 10 years before retiring to run for office.", sources: [*cc_about, *lookout49] }
      - { text: "Earlier spent seven years at Outlook Nashville as a teacher and later director of a program for children with and without disabilities from birth to age four.", sources: [*cc_about] }
      - { text: "Bachelor's degree in psychology from Saint Louis University (1981) with a teaching license in general and special education; master's degree in early childhood special education from Middle Tennessee State University (1992).", sources: [*cc_about, *bp_casha] }
      - { text: "Long-time Smyrna resident; received a Lifetime Achievement Award from the Tennessee Commission on Children and Youth.", sources: [*cc_home, *cc_about] }
    why_running:
      text: >-
        She says she is running to keep working on solutions to the problems that keep Tennessee children and
        families from thriving, and that families deserve strong public schools, affordable health care,
        accessible child care and an economy that works for everyone.
      sources: [*cc_home, *cc_about]
    platform:
      - category: economy
        text: "Set a minimum wage tied to the cost of living, so working families can thrive and not just survive."
        sources: [*bp_casha]
      - category: taxes
        text: "Exempt groceries and personal hygiene products from the sales tax."
        sources: [*bp_casha]
      - category: cost_of_living
        text: "Expand child care scholarships and subsidies, cap child care costs at 7% of family income, and support incentives to build homes under $250,000."
        sources: [*cc_issues, *bp_casha]
      - category: education
        text: "Fully fund public schools by moving money from education vouchers to public school funding, raise teacher salaries, and support literacy, early learning, and career and technical education."
        sources: [*cc_issues, *bp_casha]
      - category: health_care
        text: "Expand health insurance access, Medicaid access, preventive and maternal care, and mental health services, and lower prescription drug costs."
        sources: [*cc_issues]
    arguments:
      - stance: for
        text: >-
          She helped grow the state's voluntary pre-K program from 30 pilot classrooms to 934 serving 18,000
          children, and brings decades of work with children and families to the job.
        sources: [*cc_about]

