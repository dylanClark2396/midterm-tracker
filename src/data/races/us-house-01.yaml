id: us-house-01
office: "U.S. House, District 1"
level: us_house
district: 1
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/USHouse_Nov2026.pdf"

candidates:
  - name: "Diana Harshbarger"
    ballot_party: Republican
    city: "Kingsport"
    incumbent: true
    website: "https://www.votediana.com"
    bio_facts:
      - { text: "U.S. Representative for Tennessee's 1st Congressional District since 2021; first elected in 2020.", sources: [*lookout_guide, *gs_announce] }
      - { text: "Serves on the House Energy and Commerce Committee and is vice chair of its Subcommittee on Health.", sources: [*dh_house] }
      - { text: "Licensed pharmacist since 1987 and a business owner for over 30 years; Doctor of Pharmacy from Mercer University College of Pharmacy.", sources: [*dh_home, *dh_house] }
      - { text: "Former board member of the International Academy of Compounding Pharmacists.", sources: [*dh_house] }
    why_running:
      text: >-
        She says that, working with the current administration and House majority, she has helped lower costs, secure
        the border, strengthen rural health care, and cut federal red tape, and that she is running for re-election to
        keep that progress going. She says her focus remains serving local communities, supporting local businesses and
        farmers, and protecting East Tennessee's values.
      sources: [*gs_announce, *wvlt_endorse]
    platform:
      - category: immigration
        text: "Complete the border wall and defund sanctuary cities."
        sources: [*dh_issues]
      - category: guns
        text: "Oppose efforts to restrict the right of law-abiding citizens to keep and bear arms."
        sources: [*dh_issues]
      - category: government
        text: "Pass legislation imposing term limits on all federal offices."
        sources: [*dh_issues]
      - category: health_care
        text: "Lower drug prices, increase health care access for seniors and rural residents, promote transparency, and increase funding for addiction rehabilitation to address the opioid crisis."
        sources: [*dh_issues]
      - category: economy
        text: "Cut regulations, negotiate trade deals that benefit everyday citizens, and lower taxes."
        sources: [*dh_issues]
      - category: foreign_policy
        text: "Give the military the tools, training, and resources to protect the country from adversaries such as Russia, China, and Iran."
        sources: [*dh_issues]
      - category: education
        text: "Expand education options, including trade and technical schools, and reduce federal involvement in classrooms."
        sources: [*dh_issues]
      - category: abortion
        text: "Pro-life; says late-term abortion and other expanded abortion policies must be countered in Congress."
        sources: [*dh_issues]
    arguments:
      - stance: for
        text: >-
          She has delivered results for the district: lowering costs, securing the border, strengthening rural health
          care, and cutting federal red tape for families, veterans, and small businesses.
        sources: [*gs_announce]
      - stance: for
        text: >-
          More than three decades as a community pharmacist and business owner give her firsthand knowledge of rural
          health care, drug shortages, and drug pricing, which she brings to her work on the House health subcommittee.
        sources: [*dh_issues, *dh_house]
      - stance: for
        text: >-
          She has been endorsed for re-election for her work to cut taxes and regulations, keep the border secure, and
          support farmers, veterans, and gun rights.
        sources: [*gs_announce, *wvlt_endorse]
      - stance: against
        text: >-
          At a 2025 town hall, a constituent trying to ask about Medicaid cuts was removed by security, and attendees'
          concerns were brushed aside rather than answered.
        sources: [*gs_forum, *lookout_guide]

  - name: "Kristi Burke"
    ballot_party: Democratic
    city: "Chuckey"
    incumbent: false
    website: "https://www.votekristiburke.com/"
    bio_facts:
      - { text: "Artist who ran a mural business; has also worked in the beauty industry and produced YouTube content.", sources: [*kb_story, *kb_bp] }
      - { text: "Won the August 6, 2026 Democratic primary with about 77% of the vote.", sources: [*kb_bp] }
      - { text: "First run for public office.", sources: [*gs_forum] }
    why_running:
      text: >-
        She says she decided to run after being removed from a 2025 town hall while trying to question the incumbent
        about Medicaid cuts, and because she believes the district's concerns are being ignored. She says she is running
        to challenge a political system that protects corporate profits at the expense of human dignity and to give the
        district a representative who lives the same struggles as its residents, including renting and going without
        health insurance.
      sources: [*kb_bp, *kb_story, *gs_forum]
    platform:
      - category: health_care
        text: "Replace the current system with a universal, single-payer Medicare for All program."
        sources: [*kb_nn]
      - category: education
        text: "Fully fund public schools rather than private school vouchers, restore the U.S. Department of Education and expand Title I, raise teacher pay, and support tuition-free community college."
        sources: [*kb_nn]
      - category: taxes
        text: "Cut taxes for working families, raise taxes on the wealthiest Americans and corporations, and end loopholes and subsidies for companies that move jobs overseas."
        sources: [*kb_nn, *kb_bp]
      - category: immigration
        text: "No mass deportations or family separation; replace agencies like ICE with a system that prioritizes human rights; federal agents should not wear masks."
        sources: [*kb_nn, *kb_bp, *gs_forum]
      - category: environment
        text: "Hold corporate polluters accountable, oppose privatizing public lands, and require an accountable TVA for East Tennessee."
        sources: [*kb_nn, *kb_bp]
      - category: abortion
        text: "Protect access to abortion, birth control, and reproductive health care."
        sources: [*kb_nn]
      - category: government
        text: "Get corporate and dark money out of politics, increase transparency, and end gerrymandering."
        sources: [*kb_nn]
      - category: foreign_policy
        text: "Prioritize diplomacy, reclaim congressional war powers, and avoid unnecessary military intervention."
        sources: [*kb_nn, *kb_bp]
    arguments:
      - stance: for
        text: >-
          She shares the struggles of many district residents, renting her home, living without health insurance, and
          working out of debt, so she would bring their experience to Congress.
        sources: [*kb_bp, *kb_story]
      - stance: for
        text: >-
          She is not a career politician, and her campaign is funded entirely by individual contributions rather than
          corporate political action committee money.
        sources: [*kb_bp, *lookout_race]
      - stance: for
        text: >-
          She tried to question the incumbent about Medicaid cuts at a town hall and refused to stay silent, showing she
          will speak up for constituents whose concerns are being ignored.
        sources: [*gs_forum, *kb_story]

  - name: "Joshua Ray Ashburn"
    ballot_party: Independent
    city: "Bristol"
    bio_facts:
      - { text: "Works in customer service; 36 years old and a father of two.", sources: [*ja_bp] }
      - { text: "Filed as an independent for this seat in 2024 but is listed as having withdrawn or been disqualified before that election.", sources: [*ja_bp] }
    why_running:
      text: >-
        He says he is running because he is tired of career politicians being re-elected without truly helping the
        American people, and that he believes in term limits and in putting people ahead of politics.
      sources: [*ja_bp]
    platform:
      - category: immigration
        text: "Make border security a top priority to reduce drug trafficking and give law enforcement more resources."
        sources: [*ja_bp]
      - category: foreign_policy
        text: "Pursue peace and diplomacy and avoid unnecessary wars and overseas involvement."
        sources: [*ja_bp]
      - category: economy
        text: "Reduce taxes and cut red tape for small businesses and farmers."
        sources: [*ja_bp]
      - category: cost_of_living
        text: "Make housing affordable again."
        sources: [*ja_bp]
      - category: government
        text: "Supports term limits."
        sources: [*ja_bp]
    arguments:
      - stance: for
        text: >-
          He is not a career politician and has run without endorsements, offering voters a candidate focused on
          hardworking families rather than on politics.
        sources: [*ja_bp]

  - name: "Richard G. Baker"
    ballot_party: Independent
    city: "Johnson City"
    bio_facts:
      - { text: "Ran for this seat as an independent in 2022 (1.3% of the vote) and 2024 (1.7%), and in the 2020 Republican primary.", sources: [*rb_bp] }

  - name: "Chris Campbell"
    ballot_party: Independent
    city: "Bristol"
    website: "https://campbellforcongress2026.com/"
    bio_facts:
      - { text: "Grew up in southwestern Virginia and moved to Tennessee in 1991; has spent his career supporting manufacturers.", sources: [*cc_bp] }
    why_running:
      text: >-
        He says he is running an independent campaign to restore faith in government and give working-class families
        economic relief. He says finding his late father's decades-long paycheck ledger confirmed his view that
        trickle-down economics has left wages stagnant while Wall Street prospers.
      sources: [*cc_home, *cc_bp]
    platform:
      - category: economy
        text: "Prioritize legislation that brings manufacturing back to the U.S. and showcases the East Tennessee workforce."
        sources: [*cc_bp, *cc_home]
      - category: taxes
        text: "Tie corporate tax rates to pay disparities, with a higher rate for companies with a larger pay differential."
        sources: [*cc_home]
      - category: health_care
        text: "Leave treatment decisions to patients and providers rather than insurers, and sponsor legislation to lower insurance premiums."
        sources: [*cc_bp, *cc_home]
      - category: cost_of_living
        text: "Abolish tariffs, restore Social Security's solvency, and reform the credit reporting system."
        sources: [*cc_home, *cc_bp]
      - category: foreign_policy
        text: "End U.S. involvement in the current war."
        sources: [*cc_bp]
      - category: government
        text: "Term and age limits for members of Congress and Supreme Court justices, and an end to governing by executive order."
        sources: [*cc_bp]
    arguments:
      - stance: for
        text: >-
          As an independent, he is not tied to either major party and offers an alternative for voters who feel
          unrepresented by the two-party system.
        sources: [*cc_home]

  - name: "Billy Cody"
    ballot_party: Independent
    city: "Kingsport"

  - name: "Tyler Brice Mitchell McClain"
    ballot_party: Independent
    city: "Kingsport"

last_verified: 2026-10-13
