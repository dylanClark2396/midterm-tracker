id: tn-house-013
office: "Tennessee House, District 13"
level: state_house
district: 13
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Robert Stevens"
    ballot_party: Republican
    city: "Smyrna"
    incumbent: true
    website: "https://voterobertstevens.com/"
    bio_facts:
      - { text: "State representative for District 13 since being elected in 2022; member of the House Education, Transportation, and Private Acts committees and the Higher Education Subcommittee.", sources: [*cga_h13, *bp_stev, *stev_home] }
      - { text: "Member of the Rutherford County Commission from 2010 to 2022.", sources: [*cga_h13, *stev_home, *lookout13] }
      - { text: "Attorney practicing estate planning, trusts, and probate; also runs a small travel business.", sources: [*stev_home, *cga_h13] }
      - { text: "B.A. in political science from Lipscomb University (2006) and J.D. from the University of Memphis (2009).", sources: [*cga_h13, *bp_stev] }
      - { text: "Past president of the Rotary Club of Smyrna; former trustee of the Motlow College Foundation.", sources: [*cga_h13, *stev_home] }
    why_running: { text: null, sources: [] }
    platform:
      - category: taxes
        text: "Reduce the sales tax on groceries, cap how much local governments can raise property taxes without a public referendum, and limit growth in the state budget."
        sources: [*stev_home]
      - category: immigration
        text: "Has co-sponsored and supported bills to crack down on illegal immigration in Tennessee and says public resources should prioritize citizens."
        sources: [*stev_home]
      - category: abortion
        text: "Believes life begins at conception; supports legal protection for the unborn and promoting adoption."
        sources: [*stev_home]
      - category: guns
        text: "Keep Second Amendment protections as they are and oppose efforts to reduce the right to bear arms."
        sources: [*stev_home]
      - category: public_safety
        text: "Supports severe punishments, including lengthy prison sentences, for violent offenders; sponsored the 2026 James Bardsley, Jr. Life Protection Act setting a minimum one-year sentence, served in full, for qualifying fatal hit-and-run cases."
        sources: [*stev_home, *hb1967]
      - category: government
        text: "Sponsored a 2025 law requiring the state to recertify county and city populations each year between censuses, so fast-growing places like Rutherford County receive state-shared revenue based on current population."
        sources: [*hb0780, *stev_home]
      - category: education
        text: "Sponsored a 2024 law requiring school safety training for substitute teachers and barring districts from hiring substitutes whose license was revoked in another state."
        sources: [*hb2464, *stev_home]
    arguments:
      - stance: for
        text: >-
          His state-shared revenue law brings millions of new dollars into Rutherford County each year with no new
          taxes, easing the pressure to raise local property taxes.
        sources: [*stev_home, *hb0780]
      - stance: for
        text: >-
          He has had perfect attendance in the State House and never missed a full County Commission meeting.
        sources: [*stev_home]

  - name: "Brett Windrow"
    ballot_party: Democratic
    city: "Lavergne"
    incumbent: false
    website: "https://winwithwindrow.com/"
    bio_facts:
      - { text: "Attorney; member of the La Vergne Board of Zoning Appeals.", sources: [*win_home, *lookout13] }
      - { text: "Member of the Rutherford-Cannon Bar Association and the Nashville Bar Association.", sources: [*win_home, *lookout13] }
      - { text: "Bachelor's degree from Tennessee Technological University (2017) and law degree from Belmont University College of Law (2020).", sources: [*bp_win] }
    why_running:
      text: >-
        He says he is running because Rutherford County can do better and residents deserve better. He says he has seen
        firsthand how the legislature's refusal to govern is harming Tennesseans, with Rutherford County on the front
        line, and he is fighting to improve roads and infrastructure, save public schools, and reduce the cost of
        housing and living.
      sources: [*win_home, *bp_win]
    platform:
      - category: education
        text: "Repeal the voucher program and redirect the money to public schools; hire more teachers, raise pay, lower class sizes, and use proven interventions like free breakfast."
        sources: [*win_home, *bp_win]
      - category: infrastructure
        text: "Fund infrastructure for growth, support overburdened local governments, add transit options into Nashville to ease the load on I-24, oppose toll roads, and keep Nashville's trash out of Rutherford County."
        sources: [*win_home, *bp_win]
      - category: cost_of_living
        text: "Encourage more dense housing in Nashville, partner with developers on homes under $250,000, and stop converting farms and green space into subdivisions."
        sources: [*win_home, *bp_win]
      - category: taxes
        text: "Repeal the grocery tax, oppose new tax breaks for corporations, and change the tax structure to benefit working people."
        sources: [*win_home, *bp_win, *lookout13]
      - category: health_care
        text: "Expand TennCare to workers without employer plans, let TennCare offer low-cost plans on the private market, open more hospitals, protect access to contraception and IVF, and require workplace accommodations for pregnant women."
        sources: [*win_home]
      - category: public_safety
        text: "Increase funding for investigators focused on violent offenses and support at-risk youth to reduce violence long-term."
        sources: [*win_home]
      - category: guns
        text: "Honor the right to carry responsibly, with reasonable regulations."
        sources: [*win_home]
      - category: government
        text: "Let Tennesseans vote directly on major issues and let counties vote on legal or medical marijuana."
        sources: [*win_home]
    arguments:
      - stance: for
        text: >-
          He once quit a job at a collection agency rather than take part in predatory practices, and as an attorney he
          has represented people down on their luck and would do the same for the community.
        sources: [*win_home]
      - stance: for
        text: >-
          Repealing the voucher program and sending that money to overloaded public schools, along with more transit
          options, would address the strain that fast growth puts on the county.
        sources: [*bp_win, *win_home]

