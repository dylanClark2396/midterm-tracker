# Tennessee House, District 44 (northern Sumner County, including Portland, Westmoreland and parts of Gallatin) —
# Rep. William Lamberth, first elected in 2012 and House Majority Leader, faces Latoya Holcomb.
# Candidate order follows the Secretary of State's certified candidate list.
