id: tn-house-016
office: "Tennessee House, District 16"
level: state_house
district: 16
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Michele Carringer"
    ballot_party: Republican
    city: "Knoxville"
    incumbent: true
    website: null
    bio_facts:
      - { text: "State representative for District 16 since November 2020; House member of the 112th through 114th General Assemblies.", sources: [*bp_carr, *cga_h16] }
      - { text: "Chair of the House Population Health Subcommittee since it was created in 2023; also serves on the Health Committee, the State & Local Government Committee, and the Departments & Agencies Subcommittee.", sources: [*carr_chair, *cga_h16] }
      - { text: "House Republican Caucus secretary.", sources: [*cga_h16] }
      - { text: "Former Knox County commissioner (Districts 7B and 2) and commission vice chair.", sources: [*cga_h16] }
      - { text: "Works in advertising; attended Central High School and the University of Tennessee College of Communications.", sources: [*cga_h16, *carr_chair] }
    why_running: { text: null, sources: [] }
    platform:
      - category: public_safety
        text: "Sponsored a 2026 law requiring registered sex offenders to notify a campground's owner or operator of their status before staying overnight."
        sources: [*hb1922]
      - category: education
        text: "Sponsored a law directing the Department of Education to give guidance aligning state literacy tutoring corps services with each student's remediation needs and grade-level standards."
        sources: [*hb0640]
      - category: health_care
        text: "Sponsored a bill to have the health commissioner create programs to improve access to dental care in rural and underserved areas."
        sources: [*hb0643]
    arguments:
      - stance: for
        text: >-
          She has led the House health subcommittee on population health since its creation in 2023, working to make
          sure health bills are fully prepared before they reach the full committee.
        sources: [*carr_chair]

  - name: "Eliza Boles"
    ballot_party: Democratic
    city: "Knoxville"
    incumbent: false
    website: "https://www.elizafortn16.com"
    bio_facts:
      - { text: "Law librarian and faculty member at the University of Tennessee College of Law.", sources: [*eb_about, *lookout16, *kn_guide] }
      - { text: "Law degree from the University of Tennessee (2010) and a master's degree in library science.", sources: [*bp_boles, *eb_about, *lookout16] }
      - { text: "Raised in Mosheim, Tennessee, by her grandmother; first-generation college graduate; has lived in Knoxville since 2007.", sources: [*eb_about] }
      - { text: "First campaign for public office.", sources: [*lookout16] }
    why_running:
      text: >-
        She says she is running because working families deserve a government that works for them again, and that
        programs like Medicaid and strong public schools made her own opportunities possible. As a single mother of
        three, she says she knows the pressure of rising costs and child care, and she wants the voices of average
        Tennesseans to be heard in the legislature.
      sources: [*eb_about, *bp_boles]
    platform:
      - category: health_care
        text: "Expand Medicaid to cover Tennesseans in the coverage gap and protect access to hospitals in rural areas."
        sources: [*eb_prior, *bp_boles]
      - category: education
        text: "Repeal the Education Freedom school voucher program, put that money back into public schools, and invest in universal pre-K."
        sources: [*eb_prior, *bp_boles]
      - category: cost_of_living
        text: "Pass paid parental leave and make child care affordable for working families."
        sources: [*eb_prior]
      - category: taxes
        text: "Repeal the state sales tax on groceries and the gas tax."
        sources: [*bp_boles]
      - category: abortion
        text: "Protect reproductive freedom."
        sources: [*eb_about]
    arguments:
      - stance: for
        text: >-
          Having grown up on a fixed income and now raising three children alone, she knows firsthand the pressures
          of child care and rising costs that working families face.
        sources: [*eb_about]

last_verified: 2026-10-13
