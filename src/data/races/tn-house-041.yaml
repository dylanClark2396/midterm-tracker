id: tn-house-041
office: "Tennessee House, District 41"
level: state_house
district: 41
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Ed Butler"
    ballot_party: Republican
    city: "Cookeville"
    incumbent: true
    website: "https://edbutler.org"
    bio_facts:
      - { text: "State representative for District 41 since November 2022; House member of the 113th and 114th General Assemblies. Lost a 2018 race for the seat before winning it in 2022.", sources: [*bp_butler, *cga_h41] }
      - { text: "Vice chair of the House Transportation Committee; also serves on the State & Local Government Committee and the Cities & Counties and Transportation subcommittees.", sources: [*cga_h41] }
      - { text: "Fire sprinkler contractor and small business owner; Navy veteran.", sources: [*cga_h41, *lookout41, *eb_home] }
      - { text: "Tennessee state coordinator for the Midway Route of Run For The Wall, a veterans' motorcycle ride.", sources: [*cga_h41, *eb_about] }
      - { text: "Married with eight children, two of them adopted.", sources: [*cga_h41, *eb_about] }
      - { text: "Sponsored 2023 laws that let courts speed up adoptions of infants left at a safe-haven facility or newborn safety device, and that count three months without visits or support as abandonment of a child under four.", sources: [*hb0164, *hb0163] }
    why_running:
      text: >-
        He says he wants young people to be able to come back home to District 41, put down roots and raise their
        families, and that his goal is economic growth so families can stay in their communities for generations.
      sources: [*eb_about]
    platform:
      - category: economy
        text: "Grow the district's economy so families and young people can stay or return to raise their children."
        sources: [*eb_about]
      - category: education
        text: "Carefully review and revise current school materials and their sources, with Tennesseans producing them and lessons kept age-appropriate."
        sources: [*eb_about]
      - category: veterans
        text: "Protect veterans' rights, including their access to health care."
        sources: [*eb_about]
      - category: immigration
        text: "Says unvetted refugees put national security and local communities at risk."
        sources: [*eb_about]
      - category: environment
        text: "Opposes nuclear waste storage in Tennessee and in the district, saying no economic benefit outweighs the environmental risk."
        sources: [*eb_letter, *lookout_nuc]
      - category: guns
        text: "Supports the constitutional right to keep and bear arms."
        sources: [*eb_about]
      - category: abortion
        text: "Make adoption more readily available and streamline the process, citing the share of unintended pregnancies that end in abortion."
        sources: [*eb_about]
    arguments: []

  - name: "R. Jason Goodman"
    ballot_party: Democratic
    city: "Wartburg"
    incumbent: false
    website: null
    bio_facts:
      - { text: "Born and raised in Morgan County and a graduate of Wartburg Central High School; moved back to the county in 2010.", sources: [*bp_goodman] }
      - { text: "Bachelor's degree in electrical engineering from Tennessee Tech (1983); licensed professional electrical engineer in Tennessee.", sources: [*bp_goodman, *lookout41] }
      - { text: "Worked 31 years for TVA as a field test engineer and manager of a Transmission Service Center; now an engineering contractor.", sources: [*bp_goodman, *lookout41] }
    why_running:
      text: >-
        He says he is running to give voters a choice and to improve health care, education, economic development
        and infrastructure in Tennessee.
      sources: [*bp_goodman]
    platform:
      - category: cost_of_living
        text: "Make life more affordable through child care assistance and relief from the grocery tax."
        sources: [*bp_goodman]
      - category: education
        text: "Properly fund public schools and spend no tax dollars on private schools; if vouchers stay, limit them by income."
        sources: [*bp_goodman]
      - category: health_care
        text: "Expand Medicaid, taking the federal funding the state turns down each year that would help people earning up to 138% of the poverty level buy health insurance."
        sources: [*bp_goodman]
      - category: infrastructure
        text: "Increase transportation funding and fix Highway 62, a dangerous road many district residents drive to work in Oak Ridge."
        sources: [*bp_goodman]
      - category: guns
        text: "Owns guns and values his Second Amendment freedoms."
        sources: [*bp_goodman]
      - category: government
        text: "Amend the state constitution to allow citizen-led ballot initiatives."
        sources: [*bp_goodman]
    arguments:
      - stance: for
        text: >-
          Brings three decades of TVA engineering and management experience, including multimillion-dollar budgets
          and crews of up to 38, and promises to decide issues on logic, science and the best available data.
        sources: [*bp_goodman]

last_verified: 2026-10-16
