id: tn-house-033
office: "Tennessee House, District 33"
level: state_house
district: 33
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Rick Scarbrough"
    ballot_party: Republican
    city: "Oak Ridge"
    incumbent: true
    website: "https://rickscarbrough.com"
    bio_facts:
      - { text: "State representative for District 33 since November 2024; House member of the 114th General Assembly. Won the 2024 primary over the sitting representative and the 2024 general election with 67.7% of the vote.", sources: [*bp_scarbrough, *cga_h33, *lookout33] }
      - { text: "Serves on the House Judiciary and Insurance committees and the Criminal Justice and Insurance subcommittees.", sources: [*cga_h33] }
      - { text: "Spent six years with the Anderson County Sheriff's Office and 23 years with the Clinton Police Department, the last 16 as chief of police; named Tennessee Police Chief of the Year in 2014.", sources: [*cga_h33, *rs_about, *lookout33] }
      - { text: "Executive director of the University of Tennessee's Law Enforcement Innovation Center since 2018; graduate of the FBI National Academy.", sources: [*rs_about, *cga_h33] }
      - { text: "Bachelor's and master's degrees in organizational management from Tusculum College.", sources: [*cga_h33, *rs_about] }
      - { text: "Sponsored enacted laws expanding the harassment offense to in-person communication (HB0370), adding organized retail crime and carjacking to racketeering activity (HB0587), and barring release on personal recognizance or unsecured bond for certain charges (HB0920).", sources: [*hb0370, *hb0587, *hb0920] }
      - { text: "Sponsored a 2026 law (HB1707) requiring courts to cooperate with federal immigration authorities until February 2029 and allowing a judge who obstructs that enforcement to be referred for misconduct proceedings.", sources: [*hb1707, *tl_ice_law] }
    why_running:
      text: >-
        He says becoming a grandfather changed his perspective and that he wants every child in Tennessee to have
        the chance at a prosperous and free life. He says the district needs leaders who listen and solve problems
        rather than chase headlines, and a stronger voice in Nashville so the community is not left behind.
      sources: [*rs_why, *rs_about]
    platform:
      - category: economy
        text: "Support small businesses, lower regulations and attract high-paying jobs, with opportunity spread to every part of the state."
        sources: [*rs_home]
      - category: taxes
        text: "Keep Tennessee free of a state income tax by holding down state spending and balancing budgets."
        sources: [*rs_home]
      - category: education
        text: "Hold schools to high standards and accountability, give parents information and options, invest in career and technical education, fund schools based on each student's needs, and pay teachers well."
        sources: [*rs_home]
      - category: public_safety
        text: "Fight drug addiction by giving law enforcement resources, stopping drugs from entering the community and helping affected families; do more to protect seniors from scams and elder abuse."
        sources: [*rs_home]
      - category: immigration
        text: "Enforce federal immigration law, support border states, hold the federal government accountable for the costs of border policy, and make sure local police get the information they need."
        sources: [*rs_home]
      - category: guns
        text: "Protect constitutional rights, including the right to keep and bear arms."
        sources: [*rs_home]
    arguments:
      - stance: for
        text: >-
          Three decades in local law enforcement, 16 years of it as Clinton's police chief, give him firsthand
          knowledge of keeping Anderson County communities safe and tackling addiction.
        sources: [*rs_about, *rs_home]
      - stance: for
        text: >-
          In his first term he passed laws toughening penalties for harassment and racketeering and making it
          harder for violent offenders to get out of jail, and was named freshman of the year by the Tennessee Journal.
        sources: [*cn_rs]
      - stance: against
        text: >-
          His law letting judges be removed for obstructing federal immigration enforcement never defines
          obstruction, and when asked on the House floor he could not point to a case it would address.
        sources: [*tl_ice_house, *tl_ice_law]

  - name: "Anne Backus"
    ballot_party: Democratic
    city: "Oak Ridge"
    incumbent: false
    website: "https://www.backusfortn33.com"
    bio_facts:
      - { text: "Worked 33 years as a project manager at the Y-12 National Security Complex in Oak Ridge, retiring in 2014.", sources: [*ab_home, *cn_ab, *lookout33] }
      - { text: "Industrial engineering degree from Mississippi State University (1980).", sources: [*ab_home, *bp_backus] }
      - { text: "Volunteers as a Court Appointed Special Advocate (CASA) in Anderson County Juvenile Court and tutors young people in math.", sources: [*ab_home, *cn_ab] }
      - { text: "Ran for this seat in 2024 and lost the general election with 32.3% of the vote; won the August 2026 primary with 62%.", sources: [*bp_backus] }
    why_running:
      text: >-
        She says government needs to refocus its priorities and truly serve the people, and that she will listen
        to residents' concerns and take their voice to Nashville. She says her 2024 campaign showed her how much
        she values hearing from voters and the need for stronger representation for the district.
      sources: [*ab_home, *cn_ab, *bp_backus]
    platform:
      - category: economy
        text: "Ensure all working Tennesseans earn a living wage."
        sources: [*ab_issues, *bp_backus]
      - category: taxes
        text: "Eliminate the state sales tax on groceries."
        sources: [*ab_issues, *bp_backus]
      - category: cost_of_living
        text: "Make housing more affordable."
        sources: [*ab_issues]
      - category: education
        text: "Use tax dollars to strengthen public schools rather than expand private school vouchers."
        sources: [*ab_issues, *bp_backus]
      - category: health_care
        text: "Make health care affordable for everyone, with a focus on improving care for mothers and infants."
        sources: [*ab_issues]
      - category: immigration
        text: "Oppose proposed state laws that would treat undocumented immigrants as criminals; keep immigration status a civil matter."
        sources: [*ab_issues]
      - category: government
        text: "Stop efforts to limit public input in House committee hearings and floor sessions."
        sources: [*ab_issues]
    arguments:
      - stance: for
        text: >-
          Her 33 years managing projects at Y-12 taught her to bring diverse groups together, manage budgets and
          deliver on time, skills she says carry over to lawmaking.
        sources: [*cn_ab, *bp_backus]

