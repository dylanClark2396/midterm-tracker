id: tn-house-029
office: "Tennessee House, District 29"
level: state_house
district: 29
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Greg Vital"
    ballot_party: Republican
    city: "Harrison"
    incumbent: true
    website: "https://electgregvital.com"
    bio_facts:
      - { text: "State representative for District 29 since September 2021, when he won a special election for the seat after the death of Rep. Mike Carter, succeeding Joan Carter; House member of the 112th through 114th General Assemblies.", sources: [*bp_vital, *gv_home, *lookout29, *cga_h29] }
      - { text: "Member of the House Agriculture & Natural Resources Committee and Subcommittee, the Commerce Committee and the Transportation Committee.", sources: [*cga_h29] }
      - { text: "Co-founder and president of Morning Pointe Senior Living, a senior living and Alzheimer's care company headquartered in Ooltewah.", sources: [*cga_h29, *gv_home, *lookout29] }
      - { text: "Served on the Collegedale City Commission from 1979 to 1982 and on the Chattanooga-Hamilton County Hospital Authority board from 1983 to 1988.", sources: [*cga_h29] }
      - { text: "Board member and former chairman of the Land Trust for Tennessee and of the National Parks Conservation Association; named Conservation Legislator of the Year by the Tennessee Wildlife Federation in 2024.", sources: [*cga_h29] }
      - { text: "B.S. in business administration from Southern Adventist University; has lived in Hamilton County for about 50 years, all in the Ooltewah-Georgetown area.", sources: [*cga_h29, *gv_about] }
      - { text: "Sponsored HB1061, which would bar out-of-network ambulance providers from balance billing insured patients for covered emergency ambulance services; it passed the House 94-0 in April 2026, and its Senate companion failed in committee.", sources: [*hb1061] }
      - { text: "Sponsored HB1801, which would exempt Tennessee residents on active duty stationed out of state from sales tax on vehicle purchases; it was taken off notice in a House subcommittee in April 2026.", sources: [*hb1801] }
    why_running:
      text: >-
        His campaign says that after building a business and giving back to the community as a private citizen, he
        wants to give more through public service, bringing his business experience and vision to Nashville to serve
        District 29.
      sources: [*gv_about, *gv_home]
    platform:
      - category: economy
        text: "Keep business-friendly policies, cut burdensome regulations, write the right to work into the state constitution, and expand workforce training through community colleges and vocational programs."
        sources: [*gv_issues]
      - category: taxes
        text: "Keep Tennessee among the lowest-taxed states, with lower taxes and lean state budgets."
        sources: [*gv_issues]
      - category: education
        text: "Give schools the teachers, funding and resources they need; supports the state's school choice programs and its ban on teaching critical race theory."
        sources: [*gv_issues]
      - category: immigration
        text: "Keep building the wall on the southern border and enforce immigration laws to the fullest extent."
        sources: [*gv_issues]
      - category: environment
        text: "Protect land and open spaces for future generations, champion property rights, and oppose abusive use of eminent domain."
        sources: [*gv_issues]
      - category: guns
        text: "Defend gun rights; supported the state's permitless carry law and its Second Amendment sanctuary measure."
        sources: [*gv_issues]
      - category: abortion
        text: "Opposes abortion and supported the state's heartbeat law."
        sources: [*gv_issues]
      - category: veterans
        text: "Support active-duty service members, veterans and their families, making sure they have the resources to complete their missions and return to civilian life."
        sources: [*gv_issues]
    arguments:
      - stance: for
        text: >-
          He built a senior care company headquartered in the district that employs more than 400 people in Hamilton
          County, and says that experience equips him to keep creating jobs and growing the economy.
        sources: [*gv_home, *gv_issues]
      - stance: for
        text: >-
          A longtime land conservationist, he placed his own farm under a conservation easement and was named a
          state wildlife group's Conservation Legislator of the Year in 2024.
        sources: [*gv_about, *cga_h29]

  - name: "Ryan V. Scofield"
    ballot_party: Democratic
    city: "Ooltewah"
    incumbent: false
    website: "https://www.ryanfortn.com"
    bio_facts:
      - { text: "Works as a Social Security disability legal assistant.", sources: [*rs_about, *lookout29, *bp_scofield] }
      - { text: "Serves on the executive committees of the Tennessee Democratic Party and the Hamilton County Democratic Party.", sources: [*rs_about, *lookout29] }
      - { text: "Born in Chattanooga; spent most of his life in East Brainerd.", sources: [*bp_scofield] }
      - { text: "Ran for House District 29 in 2024, losing to Greg Vital with 29.3% of the vote.", sources: [*bp_scofield, *lookout29] }
    why_running:
      text: >-
        He says his job as a disability legal assistant puts him in touch with many Tennesseans who cannot afford
        health insurance, are near homelessness, or feel the government is not working for them, and that the best
        way he can serve them is as their advocate in Nashville.
      sources: [*bp_scofield, *rs_about]
    platform:
      - category: education
        text: "Keep public school funding with public schools; roll back the state voucher program and redirect that money to neighborhood schools."
        sources: [*rs_home, *bp_scofield]
      - category: health_care
        text: "Expand Medicaid to cover people who earn too much to qualify but cannot afford insurance; he says this would be his first bill."
        sources: [*bp_scofield]
      - category: abortion
        text: "Keep government out of reproductive health care decisions between patients and doctors."
        sources: [*rs_home, *bp_scofield]
      - category: government
        text: "Supports creating a statewide ballot initiative process so citizens can be heard, and pushing for more transparent government."
        sources: [*bp_scofield]
    arguments:
      - stance: for
        text: >-
          His daily work helping people with disability claims gives him firsthand insight into residents struggling
          to afford health care, and he pledges to be their advocate at the Capitol.
        sources: [*rs_about, *bp_scofield]

last_verified: 2026-10-16
