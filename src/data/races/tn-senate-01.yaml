id: tn-senate-01
office: "Tennessee Senate, District 1"
level: state_senate
district: 1
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNSenate_Nov2026.pdf"

candidates:
  - name: "J. Adam Lowe"
    ballot_party: Republican
    city: "Calhoun"
    incumbent: true
    website: "https://www.loweforsenate.com/"
    bio_facts:
      - { text: "State senator for District 1 since November 2022; member of the 113th and 114th General Assemblies. Won the August 2026 primary with 65.2% of the vote.", sources: [*bp_lowe, *cga_s1, *lookout_s1] }
      - { text: "Vice chair of the Senate Energy, Agriculture and Natural Resources Committee; serves on the Senate Education and State and Local Government committees and the Council on Pensions.", sources: [*cga_s1] }
      - { text: "Bradley County commissioner from 2010 to 2014, serving as vice chairman and as chairman of its education committee.", sources: [*lookout_s1, *cga_s1, *bp_lowe] }
      - { text: "B.A. from Lee University, M.P.A. from the University of Tennessee at Chattanooga, and Ph.D. in education policy from the University of Tennessee at Knoxville.", sources: [*cga_s1, *bp_lowe] }
      - { text: "College professor of public policy, author and business owner; former executive director of the Cleveland State Community College Foundation.", sources: [*camp, *bp_lowe] }
      - { text: "Supported the governor's private school voucher plan.", sources: [*lookout_s1] }
    why_running: { text: null, sources: [] }
    platform:
      - category: economy
        text: "Promote in-state commerce and state sovereignty, citing his work passing the Goods in TN Act."
        sources: [*camp]
      - category: taxes
        text: "Cut taxes, citing his vote for $1 billion in tax cuts for businesses and families."
        sources: [*camp]
      - category: education
        text: "Support private school choice, teacher merit pay and added school funding (he cites $2 billion), parental consent rules, and ending diversity, equity and inclusion programs."
        sources: [*camp]
      - category: health_care
        text: "Lead on youth mental health by expanding youth development counseling and intervention."
        sources: [*camp]
      - category: public_safety
        text: "Go after drug cartels and fentanyl distributors."
        sources: [*camp]
      - category: immigration
        text: "Curb illegal immigration."
        sources: [*camp]
      - category: veterans
        text: "Expand financial grants for the military and first responders, and support the National Guard."
        sources: [*camp]
    arguments:
      - stance: for
        text: >-
          He points to a record of fighting fentanyl distributors, sponsoring teacher merit pay and added school
          funding, and voting for $1 billion in tax cuts for businesses and families.
        sources: [*camp]
      - stance: for
        text: >-
          On his 2026 bill letting patients sue doctors who coerced them into gender treatment, he said lawmakers
          heard testimony from people who would be affected and the state should not wait for a full count of cases to act.
        sources: [*lookout_coercion]
      - stance: against
        text: >-
          Passed a 2026 Senate bill letting patients sue doctors for coercing them into gender treatment up to 30
          years later; opposing senators said it was vague and could lead to discrimination without evidence.
        sources: [*lookout_coercion]
      - stance: against
        text: >-
          Sponsored the Senate version of a 2025 bill to drop the required 2-mile buffer between scenic rivers and
          landfills; river advocates warned a nearby landfill would risk harmful pollution. His office said it would
          not move that year.
        sources: [*lookout_rivers]

last_verified: 2026-10-20
