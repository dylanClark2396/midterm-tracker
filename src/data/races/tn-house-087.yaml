  - name: "Reggie William Hall"
    ballot_party: Republican
    city: "Memphis"
    incumbent: false
    website: null
    bio_facts:
      - { text: "Born in Memphis; South Memphis resident and graduate of Hamilton High School.", sources: [*bp_hall] }
      - { text: "Bachelor's degree from Middle Tennessee State University (2001); executive director of the H.A.L.L.S. Program since 2013.", sources: [*br_hall] }
      - { text: "Small business owner who has worked in mental health, rehabilitation and transportation.", sources: [*bp_hall] }
      - { text: "Ran for Memphis mayor in 2023, receiving about 0.1 percent of the vote.", sources: [*lookout87, *bp_hall] }
    why_running: { text: null, sources: [] }
    platform: []
    arguments: []

  - name: "Karen Camper"
    ballot_party: Democratic
    city: "Memphis"
    incumbent: true
    website: "https://www.leaderkarencamper.com"
    bio_facts:
      - { text: "State representative for District 87 since 2008, when she was appointed after Rep. Gary Rowe died in office; House member of the 105th through 114th General Assemblies.", sources: [*lookout87, *cga_h87] }
      - { text: "Elected leader of her party's House caucus (House minority leader) in November 2018, the first Black legislator to lead a party caucus in the Tennessee House.", sources: [*kc_home, *lookout87] }
      - { text: "Retired from the U.S. Army as a Chief Warrant Officer Three after 21 years of service.", sources: [*kc_home, *cga_h87] }
      - { text: "Attended the University of Tennessee at Knoxville; former substitute teacher in the Memphis City Schools and owner of a music business.", sources: [*cga_h87, *bp_camper, *kc_home] }
      - { text: "Past president of the National Foundation for Women Legislators.", sources: [*kc_home] }
      - { text: "Ran for Memphis mayor in 2023.", sources: [*bp_camper] }
      - { text: "Voted against the congressional map redrawn in the May 2026 special session; afterward the House Speaker removed her and the other members of her House caucus from standing committees for the rest of 2026, citing the session's closing floor protest.", sources: [*lookout_cmte] }
    why_running: { text: null, sources: [] }
    platform: []
