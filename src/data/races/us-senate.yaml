  banner: &banner { url: "https://nashvillebanner.com/2026/08/06/marquita-bradshaw-bill-hagerty-tennessee-senate-rematch/", title: "Hagerty, Bradshaw set for 2020 rematch in U.S. Senate race (Nashville Banner)", accessed: 2026-10-13 }
