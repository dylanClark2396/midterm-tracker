id: us-senate
office: "U.S. Senate"
level: statewide
district: null
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/USSenate_Nov2026.pdf"

candidates:
  - name: "Bill Hagerty"
    ballot_party: Republican
    city: Nashville
    incumbent: true
    website: "https://teamhagerty.com/"
    bio_facts:
      - { text: "U.S. Senator from Tennessee, elected in 2020.", sources: [*bh_senate] }
      - { text: "U.S. Ambassador to Japan before joining the Senate.", sources: [*bh_senate] }
      - { text: "Commissioner of the Tennessee Department of Economic and Community Development, 2011–2014.", sources: [*bh_senate] }
    why_running:
      text: >-
        He says there is more work to do on inflation, threats from China, and the southern border, and that he is
        running to keep fighting for lower taxes, energy independence, secure borders, and the rule of law, and to help
        the current administration's agenda succeed.
      sources: [*bh_announce, *firefly_bh]
    platform:
      - category: taxes
        text: "Lower taxes and cut the federal regulatory overreach he says burdens small businesses."
        sources: [*bh_announce]
      - category: cost_of_living
        text: "Lower housing costs by reducing permitting and regulatory costs on new homes."
        sources: [*bh_afford]
      - category: infrastructure
        text: "Pursue American energy independence, and make data center operators rather than families and small businesses pay for added power infrastructure, with local communities deciding whether to permit them."
        sources: [*bh_announce, *bh_ratepayer]
      - category: immigration
        text: "Secure the southern border, and require public housing authorities to verify citizenship before providing federal housing aid."
        sources: [*bh_announce, *bh_housing]
      - category: foreign_policy
        text: "Counter threats from the Chinese Communist Party and strengthen national security."
        sources: [*bh_announce]
      - category: public_safety
        text: "Uphold the rule of law and give law enforcement the support to do their jobs, as in the federal-state crime effort in Memphis."
        sources: [*bh_announce, *bh_memphis]
      - category: guns
        text: "Defend Tennesseans' Second Amendment right to protect themselves and their families."
        sources: [*bh_2a]
      - category: abortion
        text: "Says there is a moral duty to protect unborn children and that he will advocate for policies opposing abortion."
        sources: [*bh_dobbs]
    arguments:
      - stance: for
        text: >-
          His background in business, as the state's economic development commissioner, and as U.S. Ambassador to Japan
          gives him experience in job creation, trade, and foreign affairs.
        sources: [*bh_meet, *bh_senate]
      - stance: for
        text: >-
          He has already delivered results for Tennessee, and his leadership matters as the state advances economic
          opportunity, public safety, and energy security.
        sources: [*bh_support]
      - stance: for
        text: >-
          He has been a consistent advocate for small businesses, border security, fighting crime, protecting
          constitutional rights, and cutting wasteful federal spending.
        sources: [*bh_support]
      - stance: for
        text: >-
          He is a close ally of the current White House, giving Tennessee a strong voice as the administration's agenda
          moves through Congress.
        sources: [*bh_support, *bh_announce]
      - stance: for
        text: >-
          He helped organize the federal, state, and local effort against violent crime in Memphis, which he says took
          more than 600 of the most dangerous offenders off the streets.
        sources: [*bh_memphis]
      - stance: against
        text: >-
          Before taking office, he pledged to vote against certifying the 2020 presidential results, calling them
          "tainted," then reversed course when Congress met to certify them.
        sources: [*electoral, *npost, *lookout]
      - stance: against
        text: >-
          He did not take part in a major newspaper's voter guide interview or questionnaire, leaving voters fewer
          chances to hear him answer questions directly.
        sources: [*knox]
      - stance: against
        text: >-
          He has backed broad tariffs on imports, including from Canada and Mexico, which Tennessee farmers and business
          owners say could cost them billions, while families already struggle to afford basics.
        sources: [*nbc_tariffs, *wkrn_tariffs, *knox]

  - name: "Marquita Bradshaw"
    ballot_party: Democratic
    city: Memphis
    incumbent: false
    website: "https://www.marquitabradshaw.com"
    bio_facts:
      - { text: "Executive director of Sowing Justice, an environmental justice nonprofit.", sources: [*mqb_meet] }
      - { text: "Was the 2020 nominee for this Senate seat and lost to Bill Hagerty by 27 percentage points.", sources: [*banner] }
    why_running:
      text: >-
        She says Tennesseans deserve a senator who answers to them rather than to corporations and billionaires, and
        that her public service is rooted in the challenges working families face and in giving them a stronger voice
        in Washington.
      sources: [*mqb_priorities, *mqb_meet]
    platform:
      - category: education
        text: "Well-funded public schools and competitive pay and resources for teachers."
        sources: [*mqb_priorities]
      - category: economy
        text: "Expand access to good-paying jobs, support small businesses, ensure fair wages, and raise the federal minimum wage."
        sources: [*mqb_priorities, *knox]
      - category: cost_of_living
        text: "Expand affordable housing, help renters and first-time homebuyers, and address homelessness."
        sources: [*mqb_priorities]
      - category: health_care
        text: "Affordable care regardless of income or preexisting conditions; lower prescription drug costs; protect rural hospitals; expand mental health and maternal care."
        sources: [*mqb_priorities, *knox]
      - category: government
        text: "Equal access to the ballot and independent redistricting."
        sources: [*mqb_priorities]
      - category: infrastructure
        text: "Affordable, reliable high-speed internet for every Tennessean, especially in rural areas."
        sources: [*mqb_priorities]
      - category: environment
        text: "Advance clean energy, reduce pollution, and prepare communities for climate threats."
        sources: [*mqb_priorities]
      - category: agriculture
        text: "Pursue mutually beneficial trade agreements, saying tariffs have hit farmers hard."
        sources: [*knox]
    arguments:
      - stance: for
        text: >-
          Her years of community work on environmental health and workers' rights give her direct insight into what
          working families need, and she has experienced firsthand how housing and unemployment policy can keep a
          family in its home.
        sources: [*mqb_meet, *knox]
      - stance: for
        text: >-
          Her focus on everyday costs — groceries, rent, health care, and rural hospital closures — addresses the
          problems families feel most directly.
        sources: [*knox]
      - stance: for
        text: >-
          She is running a grassroots campaign and says Tennessee deserves a senator who answers to voters rather than to
          corporations and billionaires.
        sources: [*mqb_priorities]
      - stance: against
        text: >-
          After losing the 2020 race by 27 points, she refused to concede and later called conceding an "antiquated
          tradition."
        sources: [*banner]
      - stance: against
        text: >-
          She did not complete a major newspaper's written voter guide questionnaire, leaving voters less detail on her
          positions.
        sources: [*knox]

  - name: "Tharon Chandler"
    ballot_party: Independent
    city: Lawrenceburg

  - name: "Andrew Gerena"
    ballot_party: Independent
    city: Knoxville
    website: "https://jeranimo4senate.org/"
    why_running:
      text: >-
        He says politics has drifted away from basic principles, that officials should serve the public rather than
        foreign governments or corporations, and that he is tired of the status quo.
      sources: [*gerena_home]
    platform:
      - category: foreign_policy
        text: "Shift money from the military budget to education, infrastructure, research, and job training; cut military aid to countries suspected of war crimes; investigate the lobbying group AIPAC for espionage and treason; repeal the Patriot Act."
        sources: [*gerena_issues]
      - category: taxes
        text: "Reject any tax increase and budget conservatively."
        sources: [*gerena_issues]
      - category: health_care
        text: "Overhaul the profit-based health care system and let veterans choose their own providers."
        sources: [*gerena_issues]
      - category: government
        text: "End public-facing mass surveillance systems and investigate companies that run them; release the Epstein files."
        sources: [*gerena_issues]
      - category: infrastructure
        text: "Build modern nuclear and renewable power plants and high-speed passenger rail."
        sources: [*gerena_issues]
      - category: economy
        text: "Protect the right to repair, add truck terminals for drivers, and require financial literacy classes in high schools."
        sources: [*gerena_issues]
      - category: public_safety
        text: "Make the death penalty available by jury decision for child sex offenders and traffickers, and make AI-generated news about real people a felony."
        sources: [*gerena_issues]
      - category: environment
        text: "Expand protections for parks and wildlife and regulate the environmental and privacy effects of AI data centers."
        sources: [*gerena_issues]

  - name: "Jeremy Dean Hearn"
    ballot_party: Independent
    city: Collierville

  - name: "Robert Jones"
    ballot_party: Independent
    city: Jonesborough
    website: "https://www.robertfortn.com/"
    why_running:
      text: >-
        He says the country is going through a transition that demands service and that the seat would be better
        served by someone outside the constraints of the traditional parties.
      sources: [*jones_about]
    platform:
      - category: government
        text: "Pass an Accountability Act creating a secure app or website through which public officials can see what their constituents want."
        sources: [*jones_issues]
      - category: cost_of_living
        text: "Make quality housing achievable through lower-cost prefabricated designs and recycled materials."
        sources: [*jones_issues]
      - category: health_care
        text: "Completely rethink the health care system, including what insurers must provide and where government should step in."
        sources: [*jones_issues]
      - category: environment
        text: "Focus on renewable energy, conservation, and responsible resource management."
        sources: [*jones_issues]
      - category: guns
        text: "Law-abiding gun owners should not be punished, but some controls and procedures are acceptable to prevent needless tragedies."
        sources: [*jones_issues]
      - category: abortion
        text: "Opposes a blanket abortion ban, saying it undermines a woman's freedom to protect her own life and that of her potential child."
        sources: [*jones_issues]
      - category: immigration
        text: "Supports lawful immigration and due process; those who endanger others should be punished under the law."
        sources: [*jones_issues]

  - name: "James William Macon III"
    ballot_party: Independent
    city: Memphis
    why_running:
      text: >-
        He says Tennesseans deserve a government that solves problems instead of arguing about them, and that his focus
        is lower costs, better jobs, and stronger communities.
      sources: [*macon_bp]
    platform:
      - category: economy
        text: "Bring advanced manufacturing, infrastructure investment, and workforce training to every part of the state."
        sources: [*macon_bp]
      - category: health_care
        text: "Expand access to doctors and strengthen mental health services."
        sources: [*macon_bp]
      - category: public_safety
        text: "Support law enforcement while demanding accountability."
        sources: [*macon_bp]
      - category: education
        text: "Invest in education from early childhood through career training."
        sources: [*macon_bp]
      - category: infrastructure
        text: "Modern infrastructure and high-speed internet access."
        sources: [*macon_bp]
      - category: taxes
        text: "Transparent government and responsible spending."
        sources: [*macon_bp]

  - name: "Yoshi D. Matthews"
    ballot_party: Independent
    city: Goodlettsville
    website: "https://yoshimatthewssenate.com/"
    why_running:
      text: >-
        The campaign says Tennesseans deserve leadership that reflects the state's values of fiscal responsibility,
        public safety, strong local communities, and limited government.
      sources: [*matthews_about]
    platform:
      - category: cost_of_living
        text: "Lower the cost of living and support working families and small businesses."
        sources: [*matthews_issues]
      - category: taxes
        text: "Protect seniors from losing their homes to property taxes."
        sources: [*matthews_issues]
      - category: economy
        text: "Proposes a universal basic income for eligible Americans and a narrowly defined, Tennessee-based reparations program addressing a specific historic injustice."
        sources: [*matthews_issues]
      - category: immigration
        text: "Secure the border, enforce immigration laws, and support a functional legal immigration system."
        sources: [*matthews_issues]
      - category: education
        text: "Strengthen education and expand workforce opportunities so students are prepared for careers."
        sources: [*matthews_issues]

  - name: "David Sutman, Jr."
    ballot_party: Independent
    city: Gray
    website: "https://sutmanjr4senate.com/"
    why_running:
      text: >-
        He says he is a working Tennessean, not a career politician, running to fight rising costs, restore
        accountability, and put people ahead of party.
      sources: [*sutman]
    platform:
      - category: cost_of_living
        text: "Focus on practical solutions that reduce everyday costs."
        sources: [*sutman]
      - category: government
        text: "Push for term limits, increase transparency in federal spending, and hold elected officials to performance standards."
        sources: [*sutman]

  - name: "Catherine Barcel \"Barcy\" Whitson"
    ballot_party: Independent
    city: Chattanooga
    website: "https://senatorbarcy.org/"
    platform:
      - category: economy
        text: "Lower costs, create high-paying jobs, and support local small businesses and entrepreneurs."
        sources: [*whitson_issues]
      - category: health_care
        text: "Reduce prescription drug costs and protect and improve rural hospitals."
        sources: [*whitson_issues]
      - category: education
        text: "Increase public school funding and expand vocational training, while also promoting private and home schooling."
        sources: [*whitson_issues]
      - category: cost_of_living
        text: "Partner with churches and businesses to build tiny-house communities for Tennesseans without housing."
        sources: [*whitson_issues]
      - category: public_safety
        text: "Use trauma-informed police training for encounters involving mental illness."
        sources: [*whitson_issues]
      - category: immigration
        text: "Protect migrant workers' right to be here without fear of deportation and help refugees and immigrants rebuild their lives."
        sources: [*whitson_home, *whitson_issues]
      - category: infrastructure
        text: "Expand mass transit, including reviving a Chattanooga–Atlanta bullet train initiative."
        sources: [*whitson_home]
      - category: environment
        text: "Promote green energy, safe water, and better waste management."
        sources: [*whitson_issues]

