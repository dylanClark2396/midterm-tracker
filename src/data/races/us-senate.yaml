# U.S. Senate — Sen. Bill Hagerty is seeking a second term.
# Candidate order follows the Secretary of State's certified candidate list.
# teamhagerty.com blocks automated access, so its pages are cited via Internet Archive snapshots.
_sources:
  bh_announce: &bh_announce { url: "https://web.archive.org/web/20250423203409/https://www.teamhagerty.com/news/senator-bill-hagerty-announces-re-election-for-united-states-senate", title: "Senator Bill Hagerty announces re-election for United States Senate (Hagerty campaign, archived)", accessed: 2026-10-13 }
  bh_meet: &bh_meet { url: "https://web.archive.org/web/20250125015803/https://teamhagerty.com/meet-bill/", title: "Meet Bill (Hagerty campaign, archived)", accessed: 2026-10-13 }
  bh_support: &bh_support { url: "https://web.archive.org/web/20250423210905/https://www.teamhagerty.com/news/what-they-are-saying-support-for-senator-hagertys-re-election-rolls-in", title: "What they are saying: support for Senator Hagerty's re-election (Hagerty campaign, archived)", accessed: 2026-10-13 }
  bh_senate: &bh_senate { url: "https://www.hagerty.senate.gov/about/", title: "About Senator Hagerty (U.S. Senate)", accessed: 2026-10-13 }
  firefly_bh: &firefly_bh { url: "https://tnfirefly.com/news/us-senator-bill-hagerty-shakes-up-next-years-governors-race-by-opting-to-run-for-re-election", title: "Hagerty opts to run for re-election (Tennessee Firefly)", accessed: 2026-10-13 }
  mqb_priorities: &mqb_priorities { url: "https://www.marquitabradshaw.com/priorities", title: "Priorities (Bradshaw campaign)", accessed: 2026-10-13 }
  mqb_meet: &mqb_meet { url: "https://www.marquitabradshaw.com/meet-marquita", title: "Meet Marquita (Bradshaw campaign)", accessed: 2026-10-13 }
