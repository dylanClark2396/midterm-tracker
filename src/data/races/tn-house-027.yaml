id: tn-house-027
office: "Tennessee House, District 27"
level: state_house
district: 27
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Michele Reneau"
    ballot_party: Republican
    city: "Hixson"
    incumbent: true
    website: "https://www.electmichele.com"
    bio_facts:
      - { text: "State representative for District 27 since November 2024, after defeating the sitting representative in the 2024 primary; House member of the 114th General Assembly.", sources: [*bp_reneau, *lookout27, *cga_h27] }
      - { text: "Serves on the House Government Operations and Transportation committees and the Transportation Subcommittee; named one of six deputy whips of the House Republican Caucus in 2025.", sources: [*cga_h27, *whip] }
      - { text: "B.A. in political science from the College of Charleston and a master's in public administration from the University of South Carolina; first in her family to graduate from high school and college.", sources: [*cga_h27, *mr_meet, *tfp_primary] }
      - { text: "Licensed real estate broker and small business owner; before taking office, advocated at the legislature for Tennessee's herd-share and farm-to-consumer food laws.", sources: [*mr_meet, *cga_h27] }
      - { text: "Grew up in South Carolina; has lived in Hamilton County for about 17 years; married with five children.", sources: [*mr_meet, *tfp_primary] }
    why_running:
      text: >-
        She says she ran to be a voice for Tennessee children and families, and that every vote she takes is guided
        by whether it will strengthen families and their children's future. She says she will keep prioritizing
        protecting taxpayers, supporting parents and defending constitutional rights.
      sources: [*mr_oped, *tfp_primary, *l3_forum]
    platform:
      - category: taxes
        text: "Lower taxes and reduce regulations to help individuals and small businesses prosper."
        sources: [*mr_issues]
      - category: cost_of_living
        text: "Oppose efforts to force subsidized housing into rural and suburban areas."
        sources: [*mr_issues]
      - category: education
        text: "Support local control of schools and parental rights; post all curriculum and library books online for review; cut screen time for elementary students in favor of teacher-led instruction; teach the nation's founding documents."
        sources: [*mr_issues, *mr_oped]
      - category: health_care
        text: "Supported the law barring petroleum-based artificial dyes from public and charter school meals, citing concerns about childhood nutrition and obesity."
        sources: [*mr_oped]
      - category: immigration
        text: "Limit state resources to legal residents, end benefits for people in the country illegally, criminalize mass transportation of people in the country illegally, and require E-Verify for employment."
        sources: [*mr_issues]
      - category: guns
        text: "Oppose red flag laws that would remove firearms without proper due process."
        sources: [*mr_issues]
      - category: abortion
        text: "Protect every innocent life from conception to natural death."
        sources: [*mr_issues]
      - category: government
        text: "Stop accepting federal funding that comes with strings attached, and guard free speech against censorship by large tech companies."
        sources: [*mr_issues]
    arguments:
      - stance: for
        text: >-
          Says she has never missed a day of legislative session and passed laws easing adoption home-study rules
          for non-relative guardians, limiting elementary screen time and removing artificial dyes from school meals.
        sources: [*mr_oped, *l3_forum]
      - stance: for
        text: >-
          A district voter writes that she is accessible and responsive to constituents, shows up at events across
          the district, and sends informative newsletters during session.
        sources: [*letter]
      - stance: against
        text: >-
          Her 2026 primary challenger faulted her for voting "present" on the 2026 redistricting measure, saying
          he would have voted yes or no.
        sources: [*l3_forum]
      - stance: against
        text: >-
          Critics in her 2024 race argued that her push to reject federal funding could lead to a state income tax
          and cost money the state relies on for disaster relief, schools and roads.
        sources: [*wdef24]

