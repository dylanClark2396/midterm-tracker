id: tn-house-030
office: "Tennessee House, District 30"
level: state_house
district: 30
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Esther Helton Haynes"
    ballot_party: Republican
    city: "Chattanooga"
    incumbent: true
    website: "https://electesther.com"
    bio_facts:
      - { text: "State representative for District 30 since 2018; House member of the 111th through 114th General Assemblies.", sources: [*cga_h30, *lookout30] }
      - { text: "Chair of the House Insurance Subcommittee; also serves on the Health Committee, the Insurance Committee and the Population Health Subcommittee.", sources: [*cga_h30, *lookout30] }
      - { text: "Member of the East Ridge City Council beginning in 2016.", sources: [*cga_h30, *eh_about] }
      - { text: "Nurse for nearly 44 years, many of them as a hemodialysis nurse; graduate of East Ridge High School and the Chattanooga School of Practical Nursing.", sources: [*eh_about, *cga_h30] }
      - { text: "Lifelong resident of East Ridge.", sources: [*eh_about] }
      - { text: "Sponsored a 2025 bill (HB1241) under which a physician would not commit criminal abortion when, under set conditions, ending a pregnancy because of a diagnosed lethal fetal anomaly; it was assigned to a House subcommittee.", sources: [*hb1241, *lk_hb1241] }
    why_running:
      text: >-
        Her campaign says she has made it her mission to be a voice of reason in Nashville, making sure District 30's
        voices are heard and fighting for its families' freedoms, with faith, family and freedom at the heart of her work.
      sources: [*eh_advocate]
    platform:
      - category: economy
        text: "Support small businesses and a positive business environment for job creators while holding the line on taxes."
        sources: [*eh_about]
      - category: education
        text: "Give every public school student the same opportunity to succeed; backs higher minimum teacher pay, the reworked state school funding formula, and a school resource officer in every public school."
        sources: [*eh_education]
      - category: health_care
        text: "Require insurance companies to publish the costs of medical procedures upfront, and pursue patient protections, transparency and services for underserved communities."
        sources: [*eh_families, *eh_about]
      - category: public_safety
        text: "Strengthen legal protections for law enforcement officers and keep dangerous offenders off the streets."
        sources: [*eh_families]
      - category: guns
        text: "Safeguard Second Amendment rights."
        sources: [*eh_advocate]
      - category: abortion
        text: "Protect both the unborn and the life of the mother; she has said the state's abortion ban should include an exception for fatal fetal anomalies, like the one for the mother's life."
        sources: [*eh_families, *lk_hb1241]
    arguments:
      - stance: for
        text: >-
          A nurse for more than four decades who chairs the House Insurance Subcommittee; hospital leaders have
          praised her willingness to tackle tough health care issues and her dedication to patients' access to quality care.
        sources: [*eh_tha, *eh_about, *cga_h30]
      - stance: for
        text: >-
          Her campaign credits her with helping bring business investment to the I-75 corridor in East Ridge,
          which it says created nearly 1,000 new jobs.
        sources: [*eh_about]
      - stance: for
        text: >-
          An endorsement credits her, as a former chair of the Public Employees Subcommittee, with guiding key
          legislation for state employees and advancing policies that support the state workforce.
        sources: [*eh_teampac]

  - name: "Art Rymer"
    ballot_party: Democratic
    city: "Chattanooga"
    incumbent: false
    website: "https://art4tn.com"
    bio_facts:
      - { text: "His campaign website currently states that he is not campaigning for office.", sources: [*ar_site] }
    why_running: { text: null, sources: [] }
    platform: []
    arguments: []

