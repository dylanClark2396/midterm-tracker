# Tennessee House, District 40 (Cannon, DeKalb, Jackson and Smith counties and part of Wilson County) —
# Rep. Michael Hale, in office since 2022, faces Daniel Hawthorne in a rematch of 2024.
# Candidate order follows the Secretary of State's certified candidate list.
