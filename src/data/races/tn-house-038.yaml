id: tn-house-038
office: "Tennessee House, District 38"
level: state_house
district: 38
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Kelly T Keisling"
    ballot_party: Republican
    city: "Byrdstown"
    incumbent: true
    website: "https://www.kellykeislingtn.org"
    bio_facts:
      - { text: "State representative for District 38 since 2010; House member of the 107th through 114th General Assemblies.", sources: [*cga_h38, *bp_keisling, *lookout38] }
      - { text: "Member of the House Commerce and Judiciary committees and the Banking & Consumer Affairs and Children and Family Affairs subcommittees.", sources: [*cga_h38] }
      - { text: "Pickett County Executive from 1994 to 1998.", sources: [*cga_h38, *bp_keisling] }
      - { text: "Insurance business owner (president of Keisling Insurance); Pickett County High School graduate who attended Belmont University.", sources: [*kk_about, *cga_h38, *bp_keisling] }
      - { text: "Named Legislator of the Year by the Upper Cumberland Development District in 2024 and 2025, among other legislative awards.", sources: [*cga_h38] }
      - { text: "House sponsor of a 2026 bill that, as amended in the Senate, would designate the Big South Fork of the Cumberland River in Scott County a Class II scenic river and bar new landfill permits in that county; the Senate version passed 31-0 and the House bill failed 7-7 in the Agriculture & Natural Resources Committee.", sources: [*hb2202] }
    why_running: { text: null, sources: [] }
    platform:
      - category: economy
        text: "As a small business owner, cut through the red tape that hinders business."
        sources: [*kk_issues]
      - category: taxes
        text: "Reduce taxes and oppose over-taxation of residents and businesses; points to helping balance the state budget twelve times since 2010."
        sources: [*kk_issues]
      - category: education
        text: "Support local schools, including expanded career and technical education."
        sources: [*kk_issues]
      - category: health_care
        text: "Work to find solutions to the opioid crisis."
        sources: [*kk_issues]
      - category: public_safety
        text: "Give law enforcement the support it needs to keep communities safe."
        sources: [*kk_issues]
      - category: environment
        text: "Opposes siting a long-term nuclear waste repository in Pickett, Scott or Fentress County, and wants affected communities told whether they are under consideration and given a say before sites advance."
        sources: [*kk_nuclear]
      - category: guns
        text: "Supports Second Amendment rights."
        sources: [*kk_issues]
      - category: abortion
        text: "Believes life begins at conception."
        sources: [*kk_issues]
    arguments:
      - stance: for
        text: >-
          In August 2026 he wrote to the governor asking that three district counties be removed from consideration
          for a long-term nuclear waste repository and that residents get full transparency about the process.
        sources: [*kk_nuclear]
      - stance: for
        text: >-
          Secured $100,000 in state grant funding for Macon County's recovery court, which connects people
          struggling with addiction to treatment and supervision.
        sources: [*kk_recovery]
      - stance: against
        text: >-
          In a September 2025 news report, Scott County residents organizing against a proposed landfill that would
          import out-of-state waste said they had little luck getting help from him, while the area's state senator
          had written to regulators on their behalf.
        sources: [*wpln_landfill]

  - name: "Seth McMillan"
    ballot_party: Democratic
    city: "Robbins"
    incumbent: false
    website: "https://www.electmcmillan.com"
    bio_facts:
      - { text: "Certified public accountant who owns a CPA firm; cites about 25 years in public accounting and corporate leadership.", sources: [*bp_mcmillan] }
      - { text: "Graduate of Cumberland County High School; bachelor's degree in accounting from the University of Memphis (2001).", sources: [*bp_mcmillan, *br_mcmillan] }
      - { text: "Unopposed in the August 2026 primary.", sources: [*bp_mcmillan] }
    why_running:
      text: >-
        He says the district needs a voice in Nashville that will stand up for its land, its health and residents'
        right to be heard, starting with opposing a new landfill proposed in Scott County near the Big South Fork
        National River and Recreation Area.
      sources: [*sm_home, *lookout38]
    platform:
      - category: economy
        text: "Says voters want more local jobs paying over $25 an hour; once housing supply catches up, work with economic development boards and county leaders to attract higher-earning small businesses and remote workers. Lists support for the Tennessee Waste To Jobs Act."
        sources: [*bp_mcmillan, *sm_home]
      - category: taxes
        text: "Review state laws that may be adding to inflation, such as gas or grocery taxes, for temporary relief, and have public budgets rise by a similar percentage as living costs rise."
        sources: [*bp_mcmillan]
      - category: cost_of_living
        text: "Set county-by-county goals to add two-bedroom rentals, such as 1,000 more in Scott County, to shorten waiting lists and slow rent increases."
        sources: [*bp_mcmillan]
      - category: environment
        text: "Oppose the proposed Roberta Phase II landfill in Scott County and improve the state environmental agency's permit process."
        sources: [*sm_home, *br_mcmillan]
      - category: government
        text: "Keep local control over landfills and data centers near schools and homes: keep the Jackson Law letting local governments deny landfill permits, and help counties adopt zoning for unincorporated areas."
        sources: [*bp_mcmillan, *sm_home, *lookout38]
    arguments:
      - stance: for
        text: >-
          Brings about 25 years of public accounting and corporate leadership experience and pledges to question
          whether any bill or initiative is transparent, to keep constituents' trust.
        sources: [*bp_mcmillan]

last_verified: 2026-10-16
