id: tn-house-070
office: "Tennessee House, District 70"
level: state_house
district: 70
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Clay Doggett"
    ballot_party: Republican
    city: "Pulaski"
    incumbent: true
    website: "https://claydoggettfortn.com"
    bio_facts:
      - { text: "State representative for District 70 since November 2018; House member of the 111th through 114th General Assemblies.", sources: [*bp_doggett, *cga_h70] }
      - { text: "Chairs the House Criminal Justice Subcommittee; also serves on the Judiciary and Agriculture & Natural Resources committees, the Private Acts Committee and the Children and Family Affairs Subcommittee.", sources: [*cga_h70, *lookout70] }
      - { text: "Former correctional officer with the Giles County Sheriff's Office; owns a pressure washing business.", sources: [*lookout70] }
      - { text: "B.A. in history and B.A. in political science from the University of Alabama in Huntsville; attended the Tennessee Law Enforcement Training Academy.", sources: [*cga_h70] }
      - { text: "Born and raised in Giles County, where he lives with his wife and their four children.", sources: [*cd_home] }
      - { text: "Sponsored the 2023 One Pill Will Kill Act, which added fentanyl and related drugs to the substances that qualify for certain felony offenses.", sources: [*hb0702] }
      - { text: "Sponsored 2024 laws letting law enforcement agencies hire retired members of the state retirement system as full-time school resource officers through June 2026, and requiring recorded votes when county commissions raise county employees' pay or benefits.", sources: [*hb2682, *hb2685] }
      - { text: "Co-sponsored the crime victims' rights constitutional amendment (HJR 94 and SJR 9) that appears on the November 2026 ballot.", sources: [*hjr0094, *sjr0009] }
      - { text: "Sponsored a 2026 bill, which did not pass, to create a rural revenue equity fund for counties with large shares of greenbelt farmland.", sources: [*hb2375] }
    why_running: { text: null, sources: [] }
    platform:
      - category: guns
        text: "Uphold Second Amendment gun rights, which he says he has championed through legislation."
        sources: [*cd_home]
      - category: government
        text: "Reduce government overreach and defend local decision-making authority."
        sources: [*cd_home]
    arguments:
      - stance: for
        text: >-
          He says his years as a law enforcement officer and small-business owner shaped his view that government
          must stay accountable to the people, and that he understands the needs of local farmers, families and
          public servants.
        sources: [*cd_home]
      - stance: against
        text: >-
          Advocates of a 2026 bill to allow lawful firearm carry on college campuses said that, as committee chair,
          he stalled the bill for weeks without giving it a hearing.
        sources: [*yal_campus]

  - name: "Rayanne Moos"
    ballot_party: Democratic
    city: "Lawrenceburg"
    incumbent: false
    website: null
    bio_facts:
      - { text: "General manager at TitleMax, a car-title lending company.", sources: [*lookout70] }
      - { text: "First campaign for public office.", sources: [*lookout70] }
    why_running:
      text: >-
        She says she is running because she believes the district can be the change it wants to see, and she wants
        to educate and empower voters to make a difference.
      sources: [*rm_actblue]
    platform:
      - category: education
        text: "Oppose school vouchers, which she says take funding away from public schools."
        sources: [*rm_actblue]
      - category: government
        text: "Oppose further legislation aimed at restricting noncitizen voting, saying election commissions already do that job competently."
        sources: [*rm_actblue]
    arguments:
      - stance: for
        text: >-
          She promises to focus the legislature's time and energy on policies that reach even the most rural
          communities.
        sources: [*rm_actblue]

last_verified: 2026-10-16
