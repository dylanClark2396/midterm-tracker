id: tn-house-045
office: "Tennessee House, District 45"
level: state_house
district: 45
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Brian Stewart"
    ballot_party: Republican
    city: "Hendersonville"
    incumbent: false
    website: "https://www.brianstewartfortn.com/"
    bio_facts:
      - { text: "Owner of One Stop Realty and Auction since 2019.", sources: [*bs_home, *lookout45] }
      - { text: "Raised in Goodlettsville; lives in Hendersonville.", sources: [*bs_home, *wsmv45] }
      - { text: "President of the Sumner County Realtors Association; named Sumner County Realtor of the Year in 2021; member of Hendersonville Morning Rotary and a board member of Grace Place.", sources: [*bs_home, *bs_announce] }
      - { text: "His campaign announcement refers to his past service on the Sumner County Commission.", sources: [*bs_announce] }
      - { text: "Won the August 2026 three-way primary for the seat with 48.7% of the vote.", sources: [*bp_stewart] }
    why_running:
      text: >-
        He says the seat is a chance to continue helping a community he loves, building on a career of helping
        people in need through county government and local civic and charitable groups. He promises to look out for
        Sumner County's best interests and keep education, safety and infrastructure at the forefront.
      sources: [*bs_announce, *bs_home]
    platform:
      - category: economy
        text: "Create jobs and trade education opportunities."
        sources: [*bs_home]
      - category: taxes
        text: "Help keep the state budget balanced and cut taxes."
        sources: [*bs_home, *bs_announce]
      - category: education
        text: "Improve education standards and support school staff."
        sources: [*bs_home, *bs_announce]
      - category: public_safety
        text: "Keep neighborhoods safe, support fire, police and sheriff's departments, and protect seniors from fraud and abuse."
        sources: [*bs_home, *bs_announce]
      - category: immigration
        text: "Stop illegal immigration."
        sources: [*bs_home, *bs_announce]
      - category: infrastructure
        text: "Strengthen infrastructure."
        sources: [*bs_home]
      - category: guns
        text: "Strongly supports the Second Amendment."
        sources: [*bs_home]
      - category: veterans
        text: "Be a watchdog for military families."
        sources: [*bs_home, *bs_announce]
    arguments:
      - stance: for
        text: >-
          A local small business owner and leader of the county's Realtors association, he points to years of civic
          and charitable work and promises to back first responders and school staff.
        sources: [*bs_home, *bs_announce]
      - stance: against
        text: >-
          His campaign bills him as a Marine, but reported Marine Corps records show his reserve service ended in
          2000 at the rank of private for failure to participate, under other than honorable conditions. Primary
          opponents said he misled voters; he says a medical condition cut his service short.
        sources: [*wex_usmc, *wex_record, *milcom]
      - stance: against
        text: >-
          His opponent's campaign says he has accepted thousands of dollars in contributions from the alcohol
          industry.
        sources: [*mc_issues]

  - name: "Mandy Cook"
    ballot_party: Democratic
    city: "Hendersonville"
    incumbent: false
    website: "https://www.mandycook4tn.com/"
    bio_facts:
      - { text: "Licensed physical therapist assistant who works in a Nashville hospital, helping patients relearn to walk after strokes and brain injuries.", sources: [*mc_about, *mc_issues, *lookout45] }
      - { text: "Associate's degree from Volunteer State Community College, earned through the Tennessee Reconnect program.", sources: [*mc_about, *wsmv45] }
      - { text: "Grew up in Mount Gilead, Ohio; moved to Tennessee in 2007 and worked as a full-time musician for several years; has lived in Hendersonville since 2019.", sources: [*mc_about, *mc_announce] }
      - { text: "Founded a Sumner County community organizing group and has led rallies, food drives and educational events.", sources: [*mc_about, *mc_announce] }
      - { text: "First campaign for public office; unopposed in the August 2026 primary.", sources: [*lookout45, *bp_cook] }
    why_running:
      text: >-
        She says state leaders are out of touch with the people they represent and that many residents feel left
        behind. After years of organizing against bills she opposed, she wants to move from fighting legislation to
        writing it, with a focus on lowering costs and supporting families.
      sources: [*mc_announce, *mc_home, *mc_about]
    platform:
      - category: taxes
        text: "Eliminate the state sales tax on groceries."
        sources: [*mc_issues, *bp_cook]
      - category: cost_of_living
        text: "Expand childcare subsidies and eligibility for the state Child Care Certificate Program, raise the minimum wage, and regulate short-term rentals."
        sources: [*mc_issues, *bp_cook]
      - category: education
        text: "Repeal the school voucher program and increase public school funding for teacher pay, smaller classes, updated facilities and more counselors and nurses."
        sources: [*mc_issues]
      - category: health_care
        text: "Improve health care access statewide, including rural maternal care funding and expanded TennCare coverage for women of reproductive age; protect patient data from sharing."
        sources: [*mc_issues, *bp_cook]
      - category: public_safety
        text: "Legalize and regulate cannabis and use its tax revenue for road repairs; oppose surveillance tools such as license-plate cameras."
        sources: [*mc_issues, *mc_home]
      - category: environment
        text: "Strictly regulate data centers to protect land, water, air and utility rates, and invest in clean energy and mass transit."
        sources: [*mc_issues, *mc_announce]
      - category: abortion
        text: "Introduce legislation to strengthen the medical emergency exceptions in the state's abortion ban."
        sources: [*bp_cook]
      - category: government
        text: "Force recorded votes so constituents know where representatives stand; refuses corporate PAC money."
        sources: [*bp_cook, *mc_home]
    arguments:
      - stance: for
        text: >-
          A hospital health care worker and parent, she says she takes no corporate PAC money and will answer to
          residents rather than donors.
        sources: [*mc_home, *mc_about, *bp_cook]

last_verified: 2026-10-16
