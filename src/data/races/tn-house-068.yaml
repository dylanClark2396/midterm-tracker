id: tn-house-068
office: "Tennessee House, District 68"
level: state_house
district: 68
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Aron Maberry"
    ballot_party: Republican
    city: "Clarksville"
    incumbent: true
    website: "https://votemaberry.com"
    bio_facts:
      - { text: "State representative for District 68 since November 2024, when he won the open seat with 68% of the vote; House member of the 114th General Assembly.", sources: [*bp_maberry, *cga_h68] }
      - { text: "Member of the House Education, Government Operations and Transportation committees and the K-12 and Education Instruction subcommittees.", sources: [*cga_h68] }
      - { text: "Clarksville-Montgomery County School Board member for District 7 from 2022 to 2026.", sources: [*bp_maberry, *cga_h68] }
      - { text: "Pastor since 2007; on the staff of Mosaic Church in Clarksville since 2015, where he is Next-Gen Pastor.", sources: [*am_about, *lookout68] }
      - { text: "Grew up in Clarksville and graduated from Rossview High School in 2003; degree in pastoral leadership from Valor Christian College, 2007.", sources: [*am_about, *cga_h68] }
      - { text: "Sponsored the 2025 law presuming that qualifying PTSD diagnoses in law enforcement officers and emergency medical responders were incurred in the line of duty for workers' compensation.", sources: [*hb0310, *am_results] }
      - { text: "Sponsored the 2025 law letting eligible cases from other counties transfer into Montgomery County's veterans treatment court, and a 2025 law requiring social media and internet safety instruction in grades 6 through 12.", sources: [*hb0524, *hb0825, *am_results] }
      - { text: "Sponsored the 2026 law restricting certain gender-related questions that health care providers and insurers may direct at minors.", sources: [*hb1665, *lk_hb1665] }
    why_running:
      text: >-
        He says his calling to public service grew out of two decades in church leadership and from seeing what
        pandemic school closures did to local children and families, which led him to run for school board. He
        says he is seeking re-election to keep delivering results for Montgomery County on schools, roads, health
        care access and public safety.
      sources: [*am_why, *cn_maberry, *bp_maberry]
    platform:
      - category: taxes
        text: "Keep taxes low, cut government waste and balance the budget; supports Amendment 2 to bar any state property tax in the state constitution."
        sources: [*am_issues, *am_amend2]
      - category: cost_of_living
        text: "Increase housing supply by easing barriers to development, and limit how fast local property-tax collections can grow without voter approval."
        sources: [*cn_qa68]
      - category: education
        text: "Support public schools alongside Education Freedom Scholarships and wider school choice, with emphasis on parental rights and school safety."
        sources: [*am_issues, *cn_qa68]
      - category: health_care
        text: "Reform the state's Certificate of Need laws and remove barriers so more hospitals and providers can open in Montgomery County."
        sources: [*am_issues, *cn_qa68]
      - category: public_safety
        text: "Increase penalties for violent and repeat offenders, protect crime victims, and give first responders mental health resources."
        sources: [*am_issues, *cn_qa68]
      - category: immigration
        text: "Back bills that discourage illegal relocation to Tennessee and reserve state resources for legal residents."
        sources: [*am_issues]
      - category: infrastructure
        text: "Press the state transportation department to speed widening of I-24, Trenton Road and Highway 237, and plan roads ahead of growth."
        sources: [*am_issues, *cn_qa68]
      - category: guns
        text: "Oppose red flag laws that would allow firearms to be taken without due process."
        sources: [*am_issues]
    arguments:
      - stance: for
        text: >-
          He points to a 70% bill-passage rate in his first session, among the highest in the House, including
          laws extending PTSD coverage to first responders and opening the local veterans treatment court to
          more veterans.
        sources: [*am_results, *cn_maberry]
      - stance: for
        text: >-
          He campaigned in 2024 on bringing a new hospital to Clarksville and spoke at the state hearings where
          two new hospital proposals were approved in July 2025.
        sources: [*am_results, *cn_qa68]
      - stance: against
        text: >-
          Critics of his 2026 law limiting doctors' gender questions to minors call it censorship of medical
          speech and say a doctor may be the only person some young patients can confide in.
        sources: [*lk_hb1665]

  - name: "Garfield Scott"
    ballot_party: Democratic
    city: "Clarksville"
    incumbent: false
    website: "https://www.garfieldscottfortn68.com"
    bio_facts:
      - { text: "Lifelong Clarksville resident raised in the St. Bethlehem community, one of ten children; attended Clarksville public schools and worked on his family's cattle, grain and tobacco farm.", sources: [*gs_about, *cn_scott] }
      - { text: "Retired after nearly 40 years as a professional truck driver.", sources: [*gs_about, *lookout68] }
      - { text: "Trustee of the Montgomery County Democratic Party.", sources: [*gs_about, *cn_scott] }
      - { text: "Ran for this seat in 2024 and received 32% of the vote.", sources: [*bp_scott] }
    why_running:
      text: >-
        He says Montgomery County residents deserve a strong voice in Nashville and that every constituent in
        the district should have a seat at the table, whatever their politics. He says the area's fast growth
        must be matched by investment in roads, public schools, affordable health care and working families.
      sources: [*gs_home, *gs_about, *cn_scott]
    platform:
      - category: economy
        text: "In 2024, said companies that receive taxpayer incentives should be held to their terms so communities aren't left paying for infrastructure built for promised jobs."
        sources: [*bp_scott]
      - category: taxes
        text: "Eliminate the state grocery tax, and explore legalizing and taxing cannabis with part of the revenue going to roads."
        sources: [*gs_issues, *cn_qa68]
      - category: cost_of_living
        text: "Expand affordable and starter housing through incentives and public-private partnerships, and limit large investors buying single-family homes."
        sources: [*gs_issues, *cn_qa68]
      - category: education
        text: "Keep public money in public schools rather than private-school vouchers; pay teachers competitively and fund tutoring and early help."
        sources: [*gs_issues, *cn_qa68]
      - category: health_care
        text: "Expand Medicaid and address rising premiums, deductibles and prescription drug costs."
        sources: [*cn_qa68]
      - category: public_safety
        text: "Give first responders more resources, training and mental health support, and strengthen mental health and addiction services."
        sources: [*cn_qa68]
      - category: infrastructure
        text: "Build roads and utilities ahead of new development, don't rely on toll Choice Lanes, and have large commercial developments pay their fair share."
        sources: [*gs_issues, *cn_qa68]
    arguments:
      - stance: for
        text: >-
          A lifelong resident of the district, he says nearly 40 years of driving trucks showed him firsthand
          how local roads have failed to keep pace with growth.
        sources: [*gs_about, *gs_issues]

