id: tn-house-042
office: "Tennessee House, District 42"
level: state_house
district: 42
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Ryan D. Williams"
    ballot_party: Republican
    city: "Cookeville"
    incumbent: true
    website: "https://voteryanwilliams.com/"
    bio_facts:
      - { text: "State representative for District 42 since being elected in 2010; House member of the 107th through 114th General Assemblies.", sources: [*cga_h42, *lookout42] }
      - { text: "Chair of the House Finance, Ways and Means Subcommittee; also serves on the Finance, Ways and Means, Health, and Rules committees and the Council on Pensions.", sources: [*cga_h42, *lookout42] }
      - { text: "Majority caucus chairman in the 110th General Assembly.", sources: [*cga_h42] }
      - { text: "Former Cookeville City Council member and city planning commissioner.", sources: [*cga_h42] }
      - { text: "Director of business development at J&S Construction Company; earlier a sales representative, then vice president and partner, at a Dalton, Georgia, company. B.S. in biology from Carson-Newman.", sources: [*rw_about, *cga_h42] }
      - { text: "In 2026 filed an amendment to cut the proposed expansion of the state's private-school voucher program from 20,000 to 15,000 new vouchers for 2026-27.", sources: [*lookout_vouchers] }
    why_running: { text: null, sources: [] }
    platform:
      - category: economy
        text: "Keep Tennessee pro-worker and pro-growth, building on tort reform and the workers' compensation overhaul."
        sources: [*rw_issues]
      - category: taxes
        text: "Keep the budget balanced, debt and taxes low and the rainy-day fund strong; said he could not support a proposed $20 million sales-tax break for FedEx, which he called corporate welfare."
        sources: [*rw_issues, *lookout_fedex]
      - category: education
        text: "Build on higher standards, teacher tenure changes and charter school growth; supports parents' right to choose a school while keeping voucher costs fiscally stable."
        sources: [*rw_issues, *lookout_vouchers]
      - category: public_safety
        text: "Put citizens' safety first, citing tougher DUI laws, accident prevention and lower domestic violence offenses."
        sources: [*rw_issues]
      - category: health_care
        text: "Continue investment in services for people with intellectual and developmental disabilities, mental health and substance abuse."
        sources: [*rw_issues]
    arguments:
      - stance: for
        text: >-
          A longtime lawmaker who now chairs a House finance panel, he points to balanced budgets, tax cuts and a
          record rainy-day fund and pledges to build on that record.
        sources: [*rw_issues, *rw_about, *cga_h42]
      - stance: against
        text: >-
          His opponent says he keeps backing a Nashville agenda that leaves rural communities like Putnam County
          behind while families face rising housing costs and stagnant wages.
        sources: [*ts_actblue]

  - name: "Trenton Tyler Strode"
    ballot_party: Democratic
    city: "Cookeville"
    incumbent: false
    website: null
    bio_facts:
      - { text: "Healthcare finance professional and certified medical coder and auditor.", sources: [*lookout42] }
      - { text: "Born and raised in Putnam County.", sources: [*ts_actblue] }
    why_running:
      text: >-
        He says families in the county face rising housing costs, property reappraisal pressure, underfunded schools
        and wages that lag behind, and that he is running to fight for stronger schools, better infrastructure,
        health care access, institutional reform and an economy that works for everybody.
      sources: [*ts_actblue]
    platform:
      - category: economy
        text: "An economy that works for everybody, with wages that keep up with costs."
        sources: [*ts_actblue]
      - category: education
        text: "Stronger, better-funded schools."
        sources: [*ts_actblue]
      - category: health_care
        text: "Expand access to health care."
        sources: [*ts_actblue]
      - category: infrastructure
        text: "Better infrastructure for Putnam County and the Upper Cumberland."
        sources: [*ts_actblue]
      - category: government
        text: "Institutional reform and more accountability in Nashville."
        sources: [*ts_actblue]
    arguments:
      - stance: for
        text: >-
          Born and raised in the county, he says he knows its strengths and struggles firsthand and that his
          campaign is powered by people rather than special interests.
        sources: [*ts_actblue]

last_verified: 2026-10-16
