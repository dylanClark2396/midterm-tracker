id: tn-house-024
office: "Tennessee House, District 24"
level: state_house
district: 24
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Kevin Raper"
    ballot_party: Republican
    city: "Cleveland"
    incumbent: true
    website: "https://kevinrapertn.com"
    bio_facts:
      - { text: "State representative for District 24 since the November 2022 election; House member of the 113th and 114th General Assemblies.", sources: [*bp_raper, *cga_h24, *lookout24] }
      - { text: "Vice chair of the House Education Committee; also serves on the Insurance Committee and the Higher Education and Insurance subcommittees.", sources: [*cga_h24] }
      - { text: "Bradley County commissioner for District 7 from 2018 to 2022, where he chaired the Road Committee.", sources: [*cga_h24, *kr_about, *lookout24] }
      - { text: "Retired educator who worked more than 30 years as a teacher, principal and coach; came to Cleveland in 1990 to teach math and coach at Bradley Central High School.", sources: [*kr_about, *cga_h24, *lookout24] }
      - { text: "B.S. in mathematics education from the University of Tennessee, Knoxville; M.Ed. from Tusculum University; education specialist degree from Tennessee Technological University.", sources: [*cga_h24, *bp_raper] }
      - { text: "Voted against the governor's private school voucher bill in the House Education Committee in January 2025.", sources: [*lookout_vouchers] }
      - { text: "In 2026 sponsored laws on notifying juvenile courts when truant students leave school, signs for rest areas with adult-sized changing tables, training for juvenile court guardians ad litem, and education assessments for people in state prisons.", sources: [*chattanoogan_laws] }
    why_running:
      text: >-
        He says his family's seven generations in East Tennessee and his ties to the community inspired him to run,
        and that he is seeking another term after prayer and encouragement from local residents. He says he will
        keep working to put families and the community first and to make Cleveland and Bradley County a better
        place to live.
      sources: [*kr_home, *kr_about]
    platform:
      - category: economy
        text: "Backed the bill naming Cleveland the state's Hot Slaw Capital, which he credits with drawing more tourism to the area."
        sources: [*kr_issues]
      - category: taxes
        text: "Promised not to raise taxes; points to the two largest tax cuts in state history, a $9 billion budget cut made without tapping reserves, and tax breaks for honorably discharged veterans."
        sources: [*kr_issues, *kr_about]
      - category: cost_of_living
        text: "Supported 2024 laws strengthening homeowner protections against squatters and speeding up their removal."
        sources: [*kr_issues, *kr_about]
      - category: education
        text: "Backs added money for the state school funding formula, including teacher raises toward a $50,000 minimum starting salary, and local work with court officials to reduce chronic absenteeism and truancy."
        sources: [*kr_issues]
      - category: health_care
        text: "Supports laws barring gender changes for minors and requiring student athletes to compete by sex at birth; backed mental health support, including for PTSD, for all first responders."
        sources: [*kr_issues, *kr_about]
      - category: public_safety
        text: "Sponsored a law to support school employees who are physically assaulted; backs funding for a school resource officer in every school and tougher penalties for driving under the influence."
        sources: [*kr_issues]
      - category: environment
        text: "Has met with state environmental regulators and the landfill operator about health and safety for residents near the local landfill."
        sources: [*kr_issues]
      - category: abortion
        text: "Backs the state's strict abortion law and lists protecting the rights of the unborn among his accomplishments."
        sources: [*kr_issues, *kr_about]
    arguments:
      - stance: for
        text: >-
          He says he kept both promises he made as a first-time candidate: to serve with honesty and integrity,
          and not to raise residents' taxes.
        sources: [*kr_issues]
      - stance: for
        text: >-
          He brings more than 30 years as a teacher, principal and coach to his role as vice chair of the House
          Education Committee.
        sources: [*kr_about, *cga_h24]
      - stance: for
        text: >-
          He says he has made himself easily accessible to every constituent and will keep listening to the
          district.
        sources: [*kr_about, *kr_issues]

