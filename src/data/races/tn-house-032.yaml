id: tn-house-032
office: "Tennessee House, District 32"
level: state_house
district: 32
research_status: complete
candidate_list_source: "https://sos-prod.tnsosgovfiles.com/s3fs-public/document/TNHouse_Nov2026.pdf"

candidates:
  - name: "Jack L. Stockton"
    ballot_party: Republican
    city: "Kingston"
    incumbent: false
    website: "https://jackstockton.com"
    bio_facts:
      - { text: "Roane County sheriff from 2006 until his term ended on August 31, 2026; re-elected in 2010, 2014, 2018 and 2022, unopposed the last two times.", sources: [*rcn_jan, *rcn_aug] }
      - { text: "Harriman police chief for seven years before becoming sheriff; more than 40 years in law enforcement in all.", sources: [*rcn_jul, *js_home] }
      - { text: "Served 27 years on the 911 board and two years as chairman of the TCI board; also served on the county's courthouse security and jail studies committees.", sources: [*js_home] }
      - { text: "Trained at the Tennessee Law Enforcement Academy and the FBI Leadership Development school; also studied at Alvin C. York Agricultural Institute and Jacksonville Theological Seminary.", sources: [*js_home] }
      - { text: "Won the August 6, 2026 primary for this seat with about 60% of the vote in a three-candidate field.", sources: [*bp_stockton, *rcn_aug] }
    why_running:
      text: >-
        He says he could do some good for everyone in the district and wants to be a voice for its people, with
        nothing personal to gain, after retiring from law enforcement. He says two decades as sheriff prepared him
        to lead in Nashville and to stand up for the district rather than vote as others expect.
      sources: [*rcn_jan, *rcn_jul, *js_home]
    platform:
      - category: guns
        text: "Defend the right to keep and bear arms."
        sources: [*js_home]
      - category: government
        text: "Uphold the Tennessee and U.S. constitutions and protect freedom of faith and conscience for every family."
        sources: [*js_home]
      - category: public_safety
        text: "Stand up for abused children and senior citizens."
        sources: [*js_home]
      - category: veterans
        text: "Improve infrastructure, health care and benefits for veterans, first responders and their families."
        sources: [*js_home]
      - category: health_care
        text: "Expand access to rural health care and mental health resources across the district."
        sources: [*js_home]
    arguments:
      - stance: for
        text: >-
          More than four decades in law enforcement and five terms as sheriff show a record of leadership and
          integrity that would make him a strong advocate for the state's economy and communities.
        sources: [*chamber]
      - stance: for
        text: >-
          He has balanced multi-million-dollar county budgets for decades and says he has built working
          relationships with officials and residents of every political stripe.
        sources: [*js_home]

  - name: "Ali Simpson"
    ballot_party: Democratic
    city: "Ten Mile"
    incumbent: false
    website: "https://www.simpson4tn32.com"
    bio_facts:
      - { text: "Operates a small farm with her family in Ten Mile.", sources: [*as_home, *bp_simpson] }
      - { text: "Board member of the Southeast Tennessee Young Farmers Coalition.", sources: [*as_home] }
      - { text: "AmeriCorps alumna who helped establish a home weatherization program with Habitat for Humanity; former program coordinator with SCORE and the U.S. Small Business Administration.", sources: [*as_home, *bp_simpson] }
      - { text: "Graduate of the State University of New York at Stony Brook.", sources: [*bp_simpson] }
      - { text: "First run for public office.", sources: [*lookout32] }
    why_running:
      text: >-
        She says she wants to pass policies that improve people's health, freedom and empowerment, and to reverse
        what she calls the transfer of public wealth to corporations and special interests, returning it to the
        people.
      sources: [*as_home, *bp_simpson]
    platform:
      - category: agriculture
        text: "Preserve farmland and make small farms more profitable: right to repair, water and soil health, fighting invasive species, and support for small processors and commercial kitchens."
        sources: [*as_home]
      - category: health_care
        text: "Accept Medicaid expansion funding to help small and rural hospitals, support addiction treatment, add rural transportation and mobile clinics for older adults, and oppose the Medical Ethics Defense Act."
        sources: [*as_home, *bp_simpson]
      - category: education
        text: "Oppose school vouchers; provide free breakfast and lunch for all public school students; raise pay for teachers, bus drivers and janitors; fund trades and arts programs."
        sources: [*as_home]
      - category: economy
        text: "Raise the minimum wage gradually to $18 an hour, slow the pace of data center construction, expand affordable high-speed internet, and support small businesses."
        sources: [*as_home]
      - category: cost_of_living
        text: "Reduce or remove the sales tax on groceries, ban algorithmic grocery pricing, and work toward affordable, universal child care."
        sources: [*as_home]
      - category: government
        text: "Propose anti-lobbying legislation, push for a state measure limiting corporate political spending, and restore voting rights for people with felony convictions."
        sources: [*as_home, *bp_simpson]
      - category: public_safety
        text: "Legalize and deregulate marijuana use and cultivation."
        sources: [*as_home, *bp_simpson]
      - category: abortion
        text: "Restore abortion rights."
        sources: [*as_home]
    arguments:
      - stance: for
        text: >-
          Running a family farm and working on small-business and home-weatherization programs give her firsthand
          experience with the rural livelihoods and household costs she pledges to address.
        sources: [*as_home, *bp_simpson]

