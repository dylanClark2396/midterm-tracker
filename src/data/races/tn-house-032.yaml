# Tennessee House, District 32 (Roane County and part of Loudon County, including Lenoir City) — open seat;
# Rep. Monty Fritts ran for governor instead of re-election. Former Roane County Sheriff Jack Stockton faces
# Ali Simpson.
# Candidate order follows the Secretary of State's certified candidate list.
