candidates:
  - name: "Kerry Roberts"
    ballot_party: Republican
    city: "Springfield"
    incumbent: true
    website: "https://www.kerryroberts.com/"
    bio_facts:
      - { text: "State Senator since winning a 2011 special election; re-elected in 2014, 2018, and 2022.", sources: [*kr_bio, *lookout_guide] }
      - { text: "Vice Chair of the Senate Judiciary Committee and member of the Senate Education and State and Local Government committees; earlier chaired the Senate Government Operations Committee.", sources: [*kr_bio, *bp_kr] }
      - { text: "Certified public accountant; started an accounting practice in 1984, sold it in 1990 to start a bicycle business, and later served as President and Chairman of the National Bicycle Dealers Association.", sources: [*kr_bio, *bp_kr] }
      - { text: "1983 graduate of Lipscomb University, where he was adjunct business faculty from 1984 to 1990.", sources: [*kr_bio, *bp_kr] }
    why_running:
      text: >-
        He says voters hired him to listen, represent them, and work on their behalf, and that his office acts as a
        help desk for constituents dealing with schools, state agencies, veterans' benefits, regulations, and roads.
        He says there is more work to do on addiction, generational poverty, education, crime, and the cost of
        everyday life, and he asks to keep working for the district.
      sources: [*kr_message]
    platform:
      - category: taxes
        text: "Keep taxes low, spend taxpayer dollars wisely, and balance the budget."
        sources: [*kr_message]
      - category: economy
        text: "Reduce unnecessary government burdens on small businesses and farmers and create opportunities for them."
        sources: [*kr_message]
      - category: infrastructure
        text: "Build roads and infrastructure that keep pace with growing communities."
        sources: [*kr_message]
      - category: abortion
        text: "Protection of unborn life is among the priorities he lists for his work in the Senate."
        sources: [*kr_message]
      - category: guns
        text: "Defends the 2024 law allowing teachers and administrators to carry concealed handguns under strict conditions, including local agreement, training, and background checks."
        sources: [*kr_arming]
    arguments:
      - stance: for
        text: >-
          He has consistently supported small business, understands the challenges small businesses face, and is
          committed to a business-friendly environment; he is a small business owner himself.
        sources: [*kr_nfib]
      - stance: for
        text: >-
          He values the work state employees do and has been a fair and thoughtful voice when workforce issues come
          before the legislature.
        sources: [*kr_tsea]
      - stance: for
        text: >-
          He has used his voice and vote to keep strong protections for unborn children in state law.
        sources: [*kr_rtl]

  - name: "David Lee Marcum"
    ballot_party: Independent
    city: "McEwen"
    why_running: { text: null, sources: [] }
