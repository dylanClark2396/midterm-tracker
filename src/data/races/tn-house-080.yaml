# Tennessee House, District 80 (all of Hardeman County and parts of Haywood and Madison counties) — open seat;
# Rep. Johnny Shaw, in office since 2000, is retiring. Bolivar Mayor Julian McTizic faces Andrea Bond Johnson.
# Candidate order follows the Secretary of State's certified candidate list.
