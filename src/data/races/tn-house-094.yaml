candidates:
  - name: "Ron M. Gant"
    ballot_party: Republican
    city: "Piperton"
    incumbent: true
    website: "https://rongantfortennessee.com"
    bio_facts:
      - { text: "State representative for District 94 since 2017, first elected in 2016; House member of the 110th through 114th General Assemblies.", sources: [*cga_h94, *lookout94, *bp_gant] }
      - { text: "House Majority Assistant Leader; earlier served as Majority Assistant Floor Leader in the 110th General Assembly.", sources: [*cga_h94, *rg_about] }
      - { text: "Member of the House Finance, Ways and Means Committee and its subcommittee, and of the Health Committee and its subcommittee.", sources: [*cga_h94] }
      - { text: "Fayette County commissioner from 2006 to 2010; chairman of the Fayette County Republican Party from 2000 to 2004; former chairman of the Rossville Christian Academy school board.", sources: [*cga_h94, *rg_about] }
      - { text: "Insurance agent and president of Boyle Insurance Co.; earlier spent 17 years as vice president and then president of Insurance Associates of Tennessee.", sources: [*lookout94, *rg_about] }
      - { text: "Graduate of Rossville Christian Academy and UT Martin's WestStar leadership program; studied business at Liberty University.", sources: [*cga_h94, *rg_about] }
      - { text: "House sponsor of HB2845, which as amended became the 2024 Tennessee Prevention of Drunk Driving Act, creating a task force to study impaired driving and boating.", sources: [*hb2845] }
    why_running:
      text: >-
        He says he felt called to serve his community in the state House, inspired by 2016 campaign promises on
        job creation, border security and holding China accountable.
      sources: [*rg_about]
    platform:
      - category: economy
        text: "Cut unnecessary regulations so local businesses can grow, expand workforce development programs, and keep a balanced budget that adds to the rainy-day fund."
        sources: [*rg_issues]
      - category: taxes
        text: "Keep Tennessee among the lowest-taxed states and keep cutting taxes; points to repeal of the professional privilege tax, the gym tax, the Hall income tax and the ammunition tax."
        sources: [*rg_issues]
      - category: education
        text: "Put parents in charge of their children's education, and fund local public schools, school resource officers and teacher raises."
        sources: [*rg_issues]
      - category: health_care
        text: "Pursue patient-centered health care that puts decisions with patients instead of one-size-fits-all federal mandates."
        sources: [*rg_issues]
      - category: abortion
        text: "Opposes abortion; supported the fetal heartbeat law and the law banning abortion once Roe v. Wade was overturned."
        sources: [*rg_issues]
      - category: guns
        text: "Protect the right to bear arms and support permitless carry."
        sources: [*rg_issues]
      - category: immigration
        text: "Secure the southern border before broader immigration reform; support state laws against sanctuary cities and cooperation with federal immigration enforcement."
        sources: [*rg_issues]
      - category: infrastructure
        text: "Expand high-speed broadband service to rural communities."
        sources: [*rg_issues]
    arguments:
      - stance: for
        text: >-
          He says he has helped repeal several state taxes, including the Hall income tax and the professional
          privilege tax, and backed budgets that cut taxes by more than $35 million.
        sources: [*rg_issues]
      - stance: for
        text: >-
          House colleagues elected him to the chamber's leadership team, where he says he speaks up for rural
          residents on farming, access to health care and broadband.
        sources: [*rg_about, *cga_h94]
      - stance: for
        text: >-
          After he was badly hurt in a head-on crash with a suspected drunk driver, he pushed to prevent impaired
          driving before it happens instead of only punishing it afterward.
        sources: [*wkrn_beer, *hb2845]
      - stance: for
        text: >-
          He says ending flu and whooping cough vaccine requirements for foster and adoptive families widens the
          pool of homes willing to take in infants and children.
        sources: [*lookout_vax]
      - stance: against
        text: >-
          His proposal to ban retail sales of cold beer drew skepticism across the legislature, with one chamber
          leader calling it too heavy-handed a way to stop drunk driving.
        sources: [*wkrn_beer]
      - stance: against
        text: >-
          State child welfare officials warned that his bill ending vaccine requirements for foster and adoptive
          families could endanger infants and medically fragile children, and he declined to add an exception
          for immunocompromised children.
        sources: [*lookout_vax]

