arguments:
  - stance: yes
    text: >-
      Judges currently cannot deny bail for charges like second-degree murder or aggravated rape, even when the
      evidence is strong and the defendant poses a clear danger. This gives judges the option to keep the most
      dangerous violent defendants from harming others while they await trial.
    sources: [*banner, *wkms]
  - stance: yes
    text: >-
      The change gives judges discretion, not a mandate. Bail can still be granted, the "proof is evident or the
      presumption great" standard still applies, and a defendant can still appeal a denial.
    sources: [*banner, *wkms]
  - stance: yes
    text: >-
      Under the current rule, a defendant whom a judge considers dangerous can still go free by paying a large bail
      amount. Letting judges deny bail in these cases keeps release decisions from turning on how much money a
      defendant has, and removes the incentive to inflate charges or set bail no one could pay just to keep someone
      jailed.
    sources: [*wkms, *lk0318, *lk0422]
  - stance: yes
    text: >-
      Judges would have to put their reasons for granting or denying bail on the record, making these decisions
      public and open to review.
    sources: [*banner]
  - stance: yes
    text: >-
      When the bail clause was first written, many more crimes were capital offenses, so judges could hold many
      more defendants. This restores comparable authority for the most serious crimes of today.
    sources: [*banner]
  - stance: yes
    text: >-
      Judges are expected to deny bail in relatively few cases, so the change is not expected to bring a large rise
      in jail costs or crowding.
    sources: [*wkms, *lk0318]
  - stance: no
    text: >-
      People charged with a crime are presumed innocent, and many cases end in dismissal: about one in five
      statewide over 2011–2017, and one in three violent cases in Shelby County in December 2025. Holding people for
      months before trial can cost them their job, home, and family stability, with nothing given back if the case
      falls apart.
    sources: [*aclu, *wkms]
  - stance: no
    text: >-
      The change reaches well beyond the six crimes named on the ballot. The 85% clause adds dozens of offenses —
      most reports put the count above 70 — that voters will not see listed, so voters and defendants lack clear
      notice of which charges lose the right to bail.
    sources: [*wkms, *banner, *aclu, *lk0214]
  - stance: no
    text: >-
      The text does not say bail may be denied for these charges; it removes the right to bail for them. That makes
      detention the starting point rather than the exception.
    sources: [*lk0318, *wkms]
  - stance: no
    text: >-
      More pretrial detention means more people in county jails that are already near capacity, and the state does
      not reimburse counties for those costs. Counties without beds may have to release people held on lesser
      charges or build new jails, which can cost hundreds of millions of dollars. The official fiscal note covers
      only ballot printing.
    sources: [*wkms, *aclu, *lk0529]
  - stance: no
    text: >-
      Judges already have tools to manage risk: they can set high bail, weigh criminal history and past failures to
      appear, order no-contact conditions and electronic monitoring, and revoke bail after a hearing.
    sources: [*banner, *aclu, *wkms]
  - stance: no
    text: >-
      Studies find that holding more people before trial does not reliably reduce future crime, and violent crime in
      Tennessee has already been falling.
    sources: [*banner]
  - stance: no
    text: >-
      Even a short time in jail before trial can make it harder for a defendant to help prepare a defense.
    sources: [*aclu]
  - stance: no
    text: >-
      Judges bring their own biases into the courtroom, so wider power to deny bail could fall hardest on poor
      defendants and defendants of color.
    sources: [*lk0422]

