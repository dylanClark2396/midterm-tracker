arguments:
  - stance: yes
    text: >-
      Judges currently cannot deny bail for charges like second-degree murder or aggravated rape, even when the
      evidence is strong and the defendant poses a clear danger. This gives judges the option to keep the most
      dangerous violent defendants from harming others while they await trial.
    sources: [*banner, *wkms]
  - stance: yes
    text: >-
      The change gives judges discretion, not a mandate. Bail can still be granted, the high "proof is evident or
      the presumption great" standard still applies, and a defendant can still appeal a denial.
    sources: [*banner, *wkms]
  - stance: yes
    text: >-
      Under the current rule, a defendant whom a judge considers dangerous can still go free by paying a large bail
      amount. Letting judges deny bail in these cases keeps release decisions from turning on how much money a
      defendant has.
    sources: [*wkms]
  - stance: yes
    text: >-
      Judges would have to put their reasons for granting or denying bail on the record, making these decisions
      public and open to review.
    sources: [*banner]
  - stance: yes
    text: >-
      When the bail clause was first written, many more crimes were capital offenses, so judges could hold many
      more defendants. This restores comparable authority for the most serious crimes of today.
    sources: [*banner]
  - stance: no
    text: >-
      People charged with a crime are presumed innocent. Holding them for months before trial can cost them their
      job, home, and family stability, and those later found not guilty get nothing back for that lost time.
    sources: [*aclu, *wkms]
  - stance: no
    text: >-
      The change is broader than the six crimes named on the ballot. The 85% clause covers roughly 73 offenses that
      are not listed, and that list has grown as sentencing laws have changed.
    sources: [*wkms, *banner]
  - stance: no
    text: >-
      More pretrial detention means more people in county jails that are already near capacity, and the state does
      not reimburse counties for those costs. The official fiscal note covers only ballot printing, not jail costs.
    sources: [*wkms, *aclu]
  - stance: no
    text: >-
      Judges already have tools to manage risk: they can set high bail, weigh criminal history and past failures to
      appear, order no-contact conditions and electronic monitoring, and revoke bail after a hearing.
    sources: [*banner, *aclu, *wkms]
  - stance: no
    text: >-
      Studies find that holding more people before trial does not reliably reduce future crime, and violent crime in
      Tennessee has already been falling.
    sources: [*banner]
  - stance: no
    text: >-
      Pretrial detention makes it harder for defendants to work with their lawyers and prepare a defense, which
      weakens a fair trial.
    sources: [*aclu]

