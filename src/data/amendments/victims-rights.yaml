arguments:
  - stance: yes
    text: >-
      The victims' rights added in 1998 have proven inadequate and largely unenforceable in practice. This version
      gives victims rights they can actually assert, with a process the legislature must create.
    sources: [*wpln, *fox]
  - stance: yes
    text: >-
      Victims gain a real voice in parole: the right to be informed, to take part, and to have their safety and their
      family's safety considered before an offender is released.
    sources: [*wpln]
  - stance: yes
    text: >-
      A victim's concern about an attacker's release does not depend on the attacker's age, so these rights should
      also apply when the offender is a juvenile.
    sources: [*wpln]
  - stance: yes
    text: >-
      Notifications become something a victim asks for, rather than something they must opt out of, so victims who
      do not want updates are not forced to relive the crime.
    sources: [*wpln]
  - stance: yes
    text: >-
      Defendants' rights are spelled out in the Constitution; placing victims' rights there too brings them closer
      to equal footing in the justice system.
    sources: [*fox]
  - stance: yes
    text: >-
      Unlike versions adopted in some other states, this one leaves out language on keeping victims' records
      private, which elsewhere was used to withhold the names of officers involved in use-of-force cases. It also
      does not limit prosecutors or courts.
    sources: [*wpln]
  - stance: no
    text: >-
      Crime victims already have rights in the Tennessee Constitution. The state can improve services for victims and
      awareness of existing rights without amending the Constitution again.
    sources: [*aclu, *wpln]
  - stance: no
    text: >-
      Laws can be strengthened year after year, but constitutional text is slow to change. Fixing this list in the
      Constitution could make it harder to expand victims' rights later and could end up hurting victims.
    sources: [*wpln]
  - stance: no
    text: >-
      Comparing victims' rights to the rights of the accused is misleading. The accused's protections exist to limit
      the government's power to arrest, prosecute, and punish.
    sources: [*aclu]
  - stance: no
    text: >-
      Adding new rights for victims at every stage of a case could erode the presumption of innocence, especially in
      juvenile cases.
    sources: [*aclu]
  - stance: no
    text: >-
      It is unclear how the state would pay for the extra work these rights could create for courts.
    sources: [*wpln]

