id: property-tax
number: 2
title: "Ban on a state property tax"
article: "Article II, Section 28"
resolutions:
  - { name: "HJR 81 (113th General Assembly)", url: "https://publications.tnsosfiles.com/acts/113/resolutions/hjr0081.pdf" }
  - { name: "SJR 1 (114th General Assembly)", url: "https://publications.tnsosfiles.com/acts/114/resolutions/sjr0001.pdf" }

ballot_question: |
  Shall Article II, Section 28 of the Constitution of the State of Tennessee be amended by deleting the following language from the first sentence:

  In accordance with the following provisions, all property real, personal or mixed shall be subject to taxation, but the Legislature

  and substituting instead the following:

  In accordance with the following provisions, all property real, personal, or mixed shall be subject to taxation, but the Legislature shall not levy, authorize, or otherwise permit any state tax upon such property, and the Legislature

official_summary: >-
  This amendment adds text to Article II, section 28 of the Tennessee Constitution that prohibits the Legislature
  from imposing a State property tax on real, personal, or mixed property.

summary_plain: >-
  Tennessee has not collected a state-level property tax since 1949, but the legislature could create one today
  with an ordinary law. This amendment would write a ban on any state property tax into the Constitution, so a
  future state property tax would require another constitutional amendment approved by voters. Property taxes
  set by counties and cities are not affected. A YES vote adds the ban; a NO vote keeps the current language.

