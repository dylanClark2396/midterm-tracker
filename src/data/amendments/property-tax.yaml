arguments:
  - stance: yes
    text: >-
      Today a future legislature could create a state property tax with an ordinary majority vote. Once the ban is in
      the Constitution, undoing it would take passage by two legislatures, a two-thirds vote in the second, and
      approval from voters.
    sources: [*oped, *tfp]
  - stance: yes
    text: >-
      Homeowners, farmers, and businesses already pay local property taxes. The ban protects them from ever being
      taxed twice on the same property by both the state and local government.
    sources: [*tfp, *explained, *fox17]
  - stance: yes
    text: >-
      Avoiding an extra state tax keeps the cost of owning property down, which helps first-time buyers and renters,
      since property taxes are passed on to tenants as higher rent, and encourages building and maintaining
      affordable housing.
    sources: [*tfp, *fox17, *oped, *beacon]
  - stance: yes
    text: >-
      Farmers can owe more tax when land values rise even if their income does not, and older residents on fixed
      incomes are especially exposed to property tax bills. A permanent ban removes that risk at the state level.
    sources: [*oped]
  - stance: yes
    text: >-
      Like the 2014 amendment banning a state tax on payroll and earned income, this puts a basic tax decision in the
      hands of voters rather than lawmakers, and locks in the low-tax approach that has drawn residents and
      businesses to the state.
    sources: [*tfp, *wkrn, *beacon]
  - stance: yes
    text: >-
      Counties and cities keep full authority to levy property taxes, so local funding for schools, roads, and
      first responders is not affected.
    sources: [*oped]
  - stance: yes
    text: >-
      Property tax should remain a local revenue source. A state levy would compete with counties and cities for the
      same tax base, and would be a tempting alternative to cutting spending when budgets get tight.
    sources: [*lk0602, *claiborne]
  - stance: yes
    text: >-
      Even the possibility of a state property tax is a barrier for businesses large and small deciding whether to
      locate or expand in Tennessee and create jobs.
    sources: [*farmbureau]
  - stance: no
    text: >-
      The amendment is unnecessary. The state has not taxed property since 1949, no one is proposing to bring it back,
      and there is no threat to guard against.
    sources: [*wkrn, *lkguide, *explained]
  - stance: no
    text: >-
      Locking the ban into the Constitution binds lawmakers decades from now, whatever circumstances they face,
      including war, economic collapse, or another genuine state emergency.
    sources: [*wkrn, *fox17]
  - stance: no
    text: >-
      The amendment limits a taxing power the state does not use while leaving untouched the taxes it actually
      collects. A serious effort to limit taxing authority would start with those.
    sources: [*wkrn]
  - stance: no
    text: >-
      The state already requires local governments to levy property taxes, so banning a state property tax does not
      take the state out of property taxation.
    sources: [*claiborne]

