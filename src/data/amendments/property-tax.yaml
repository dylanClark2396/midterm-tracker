# Amendment 2 — Ban on a state property tax (Article II, Section 28)
_sources:
  tfp: &tfp { url: "https://www.timesfreepress.com/news/2026/oct/06/ban-on-state-property-tax-on-november-ballot-for/", title: "Ban on state property tax on November ballot for Tennessee voters (Chattanooga Times Free Press)", accessed: 2026-10-13 }
  oped: &oped { url: "https://www.timesfreepress.com/news/2026/oct/06/opinion-vote-yes-on-amendment-2-to-keep-tennessee/", title: "Vote Yes on Amendment 2 to keep Tennessee free from a state property tax (op-ed, Chattanooga Times Free Press)", accessed: 2026-10-13 }
  fox17: &fox17 { url: "https://fox17.com/news/local/2025-3-18-tennessee-senate-advances-amendment-to-ban-state-property-tax-nashville-tn", title: "Tennessee Senate advances amendment to ban state property tax (FOX 17)", accessed: 2026-10-13 }
