arguments:
  - stance: yes
    text: >-
      Right now a future legislature could bring back a state property tax with a simple majority vote. Putting the
      ban in the Constitution means reversing it would take two separate legislatures, a two-thirds vote, and
      approval from voters.
    sources: [*oped, *tfp]
  - stance: yes
    text: >-
      Homeowners, farmers, and businesses already pay local property taxes. The ban protects them from ever being
      taxed twice on the same property by both the state and local government.
    sources: [*tfp, *explained, *fox17]
  - stance: yes
    text: >-
      Keeping the cost of owning property predictable helps with housing affordability, supports first-time
      buyers, and can keep rents lower and encourage building and maintaining affordable housing.
    sources: [*tfp, *fox17, *oped]
  - stance: yes
    text: >-
      Farmers can owe more tax when land values rise even if their income does not, and older residents on fixed
      incomes are especially exposed to property tax bills. A permanent ban removes that risk at the state level.
    sources: [*oped]
  - stance: yes
    text: >-
      Like the 2014 ban on a state income tax, this puts a basic tax decision in the hands of voters rather than
      lawmakers, and locks in the low-tax approach that has drawn residents and businesses to the state.
    sources: [*tfp]
  - stance: yes
    text: >-
      Counties and cities keep full authority to levy property taxes, so local funding for schools, roads, and
      first responders is not affected.
    sources: [*oped]
  - stance: no
    text: >-
      The amendment is unnecessary. Tennessee has not taxed property at the state level in decades, and a ban
      written into ordinary law would accomplish the same thing without changing the Constitution.
    sources: [*explained]
  - stance: no
    text: >-
      The phrase "levy, authorize, or otherwise permit" could be read to reach beyond a state property tax, which
      could cost the state millions in revenue and threaten its bond rating.
    sources: [*explained]
  - stance: no
    text: >-
      Locking the ban into the Constitution limits the options of future lawmakers to raise revenue for statewide
      services, including during a fiscal emergency.
    sources: [*fox17, *explained]

