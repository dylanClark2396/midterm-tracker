name: Validate and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly re-check of source links.
    - cron: '0 13 * * 1'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate content and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Schema validation: sources required, label blocklist, platform rules.
      - run: npm run validate
      # Type errors in .astro and .ts files (the build doesn't report them).
      - run: npm run check
      # Contact form fields, topics and limits match the Worker (deployed separately).
      - run: npm run check:contact
      # Relative links in the CLAUDE.md agent guides.
      - run: npm run docs:check
      - run: npm run build
      # Fails on broken internal links, missing anchors, and dead (404/410/DNS) source URLs.
      - run: npm run check:links
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy to Cloudflare
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: https://tnelection.org/
    steps:
      # For wrangler.jsonc (Worker name, account, custom domain, asset settings).
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          # The action's default Wrangler (3.x) can't deploy an assets-only Worker.
          wranglerVersion: '4.151.3'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy
